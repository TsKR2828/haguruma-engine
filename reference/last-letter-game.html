<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最後一封信</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Noto Serif TC', 'Cormorant Garamond', serif;
    background: #0a0d0a;
    color: #c9b88a;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.7;
  }
  
  #game {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 30px;
    min-height: 100vh;
    position: relative;
  }
  
  /* SAN 扭曲層 */
  #distortion {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 100;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(20,5,5,0.4) 100%);
    opacity: 0;
    transition: opacity 1.5s;
  }
  
  #noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 99;
    opacity: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3' /></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.4'/></svg>");
    transition: opacity 1s;
  }
  
  h1 {
    font-size: 2.4em;
    text-align: center;
    color: #d4c089;
    margin-bottom: 8px;
    letter-spacing: 0.15em;
    font-weight: 500;
  }
  
  .subtitle {
    text-align: center;
    font-style: italic;
    color: #8a7d5a;
    margin-bottom: 40px;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.05em;
  }
  
  .panel {
    background: rgba(15, 18, 15, 0.8);
    border: 1px solid #3a3528;
    padding: 30px;
    margin-bottom: 24px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
  }
  
  .panel h2 {
    color: #b8a76d;
    font-size: 1.3em;
    margin-bottom: 16px;
    border-bottom: 1px solid #3a3528;
    padding-bottom: 8px;
    letter-spacing: 0.1em;
  }
  
  /* 屬性面板 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin: 20px 0;
  }
  
  .stat {
    background: rgba(0,0,0,0.4);
    padding: 16px;
    border-left: 2px solid #6b5e3a;
    position: relative;
  }
  
  .stat-name {
    font-size: 0.85em;
    color: #8a7d5a;
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }
  
  .stat-value {
    font-size: 1.8em;
    color: #d4c089;
    font-weight: 500;
    font-family: 'Cormorant Garamond', serif;
  }
  
  .stat-formula {
    font-size: 0.75em;
    color: #5a513a;
    font-style: italic;
    margin-top: 4px;
  }
  
  .dice-rolling {
    animation: shake 0.05s infinite;
  }
  
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-1px); }
    75% { transform: translateX(1px); }
  }
  
  /* 擲骰判定面板 */
  .roll-check {
    background: rgba(0,0,0,0.5);
    border: 1px solid #4a4028;
    padding: 24px;
    margin: 20px 0;
    text-align: center;
  }
  
  .roll-check-title {
    color: #8a7d5a;
    font-size: 0.9em;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }
  
  .roll-check-formula {
    color: #c9b88a;
    font-size: 1.1em;
    margin-bottom: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
  }
  
  .roll-dice {
    font-size: 3em;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    color: #d4c089;
    margin: 12px 0;
    letter-spacing: 0.05em;
    min-height: 1.2em;
  }
  
  .roll-result-success {
    color: #b8a76d;
    font-size: 1.2em;
    letter-spacing: 0.15em;
    margin-top: 8px;
  }
  
  .roll-result-fail {
    color: #a04040;
    font-size: 1.2em;
    letter-spacing: 0.15em;
    margin-top: 8px;
  }
  
  /* 損失提示框 */
  .impact-box {
    background: rgba(40, 10, 10, 0.4);
    border-left: 3px solid #a04040;
    padding: 12px 16px;
    margin: 16px 0;
    color: #d4a89a;
    font-size: 0.95em;
  }
  
  .impact-box.gain {
    background: rgba(20, 30, 20, 0.4);
    border-left-color: #6b8a4a;
    color: #b8c89a;
  }
  
  .impact-box .impact-line {
    margin: 4px 0;
  }
  
  .impact-box .impact-label {
    color: #8a7d5a;
    font-size: 0.85em;
    letter-spacing: 0.1em;
  }
  
  /* 按鈕 */
  button {
    background: transparent;
    border: 1px solid #6b5e3a;
    color: #c9b88a;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.1em;
    margin: 6px 4px;
  }
  
  button:hover:not(:disabled) {
    background: #2a2418;
    border-color: #c9b88a;
    color: #e8d99a;
  }
  
  button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  
  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
    justify-content: center;
  }
  
  /* 文字內容 */
  .narrative {
    font-size: 1.05em;
    margin-bottom: 20px;
    text-align: justify;
    min-height: 60px;
  }
  
  .narrative p {
    margin-bottom: 14px;
  }
  
  .typing::after {
    content: '▊';
    animation: blink 0.8s infinite;
    color: #b8a76d;
  }
  
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  
  /* 狀態列 */
  #status-bar {
    position: sticky;
    top: 0;
    background: rgba(10, 13, 10, 0.95);
    border-bottom: 1px solid #3a3528;
    padding: 12px 20px;
    margin: -40px -30px 30px -30px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 0.9em;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  
  .status-item {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  
  .status-label {
    color: #6b5e3a;
    letter-spacing: 0.1em;
    font-size: 0.85em;
  }
  
  .status-value {
    color: #d4c089;
    font-weight: 500;
  }
  
  .san-low { color: #a04040 !important; }
  
  /* 信件 */
  .letter {
    background: linear-gradient(135deg, #1a1812 0%, #14110a 100%);
    border: 1px solid #4a4028;
    padding: 32px;
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
    font-style: italic;
    line-height: 2;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.4);
  }
  
  .letter::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence baseFrequency='0.6' numOctaves='2' /></filter><rect width='100' height='100' filter='url(%23n)' opacity='0.05'/></svg>");
    pointer-events: none;
  }
  
  /* 線索清單 */
  .clue-list {
    list-style: none;
    padding-left: 0;
  }
  
  .clue-list li {
    padding: 8px 0 8px 20px;
    border-left: 2px solid #4a4028;
    margin-bottom: 6px;
    color: #a89968;
    font-size: 0.95em;
  }
  
  .clue-new {
    animation: clueGlow 2s;
  }
  
  @keyframes clueGlow {
    0% { color: #e8d99a; border-left-color: #c9b88a; }
    100% { color: #a89968; border-left-color: #4a4028; }
  }
  
  /* 結局 */
  .ending {
    text-align: center;
    padding: 40px 20px;
  }
  
  .ending-title {
    font-size: 2em;
    color: #d4c089;
    letter-spacing: 0.3em;
    margin-bottom: 24px;
    font-weight: 500;
  }
  
  .ending-text {
    font-style: italic;
    color: #a89968;
    line-height: 2;
    max-width: 540px;
    margin: 0 auto 30px;
    font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  }
  
  /* SAN 雜訊文字效果 */
  .corrupted {
    display: inline-block;
  }
  
  /* 房間導航 */
  .room-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
  
  .room-btn {
    padding: 18px;
    text-align: left;
    line-height: 1.4;
  }
  
  .room-btn small {
    display: block;
    color: #6b5e3a;
    font-size: 0.8em;
    margin-top: 4px;
    font-style: italic;
  }
  
  /* 必讀章節提示 */
  .chapter-locked {
    color: #5a4030;
    font-style: italic;
  }
  
  .warning {
    color: #a04040;
    font-size: 0.9em;
    margin-top: 8px;
    font-style: italic;
  }
  
  /* 滾動條 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0a0d0a; }
  ::-webkit-scrollbar-thumb { background: #3a3528; }
</style>
</head>
<body>
<div id="distortion"></div>
<div id="noise"></div>
<div id="game"></div>

<script>
// ==================== 遊戲狀態 ====================
const state = {
  scene: 'title',
  stats: { san: 0, sanMax: 0, int: 0, edu: 0, pow: 0, luck: 0 },
  rerollUsed: false,
  time: 0, // 遊戲內分鐘數，從 0 開始
  timeLimit: 360, // 6 小時 = 360 分鐘到天亮
  clues: [],
  visited: {},
  flags: {},
  chaptersRead: [],
};

// ==================== 工具函式 ====================
const $ = (sel) => document.querySelector(sel);
const game = () => $('#game');

const roll = (n, sides) => {
  let total = 0;
  for (let i = 0; i < n; i++) total += Math.floor(Math.random() * sides) + 1;
  return total;
};

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// SAN 視覺效果
function updateDistortion() {
  const ratio = state.stats.san / state.stats.sanMax;
  const distort = $('#distortion');
  const noise = $('#noise');
  if (ratio < 0.7) distort.style.opacity = (0.7 - ratio) * 1.5;
  else distort.style.opacity = 0;
  if (ratio < 0.4) noise.style.opacity = (0.4 - ratio) * 0.6;
  else noise.style.opacity = 0;
}

// 文字雜訊化（SAN 越低越亂）
function corrupt(text) {
  const ratio = state.stats.san / state.stats.sanMax;
  if (ratio > 0.5) return text;
  const corruptChars = '̷̧̢̡̕͝͞҉̴̶̸͍̩̭̮̯̪̟̱̬̜̦̤̳';
  const intensity = (0.5 - ratio) * 2;
  return text.split('').map(c => {
    if (Math.random() < intensity * 0.15 && c.trim()) {
      return c + corruptChars[Math.floor(Math.random() * corruptChars.length)];
    }
    return c;
  }).join('');
}

// 打字機效果
async function typeText(element, text, speed = 30) {
  element.textContent = '';
  element.classList.add('typing');
  for (let i = 0; i < text.length; i++) {
    element.textContent += text[i];
    await sleep(speed);
  }
  element.classList.remove('typing');
}

// 扣 SAN
function loseSan(amount, reason = '') {
  const before = state.stats.san;
  state.stats.san = Math.max(0, state.stats.san - amount);
  updateDistortion();
  return { before, after: state.stats.san, lost: before - state.stats.san };
}

// 擲骰判定動畫（d100 vs 屬性）
async function performCheck(statName, statValue, label) {
  // 找 panel 容器或直接掛在 game 下
  let host = $('#check-area');
  if (!host) {
    // 在 panel 內找一個地方插入
    const panel = document.querySelector('.panel');
    if (panel) {
      host = document.createElement('div');
      host.id = 'check-area-temp';
      panel.appendChild(host);
    } else {
      host = document.createElement('div');
      game().appendChild(host);
    }
  }
  
  host.innerHTML = `
    <div class="roll-check">
      <div class="roll-check-title">${label}</div>
      <div class="roll-check-formula">d100 ≤ ${statName} (${statValue})</div>
      <div class="roll-dice" id="dice-display">--</div>
      <div id="roll-outcome"></div>
    </div>
  `;
  
  const display = host.querySelector('#dice-display');
  const outcome = host.querySelector('#roll-outcome');
  
  // 滾動動畫（前快後慢）
  for (let i = 0; i < 20; i++) {
    display.textContent = String(Math.floor(Math.random() * 100) + 1).padStart(2, '0');
    await sleep(40 + i * 10);
  }
  
  const result = roll(1, 100);
  const success = result <= statValue;
  display.textContent = String(result).padStart(2, '0');
  display.style.color = success ? '#b8a76d' : '#a04040';
  
  await sleep(500);
  outcome.innerHTML = success
    ? `<div class="roll-result-success">✓ 判定成功</div>`
    : `<div class="roll-result-fail">✗ 判定失敗</div>`;
  
  await sleep(1100);
  return { success, value: result };
}

// 顯示影響（SAN 損失、線索獲得等）
function showImpact(lines, type = 'loss') {
  const box = document.createElement('div');
  box.className = `impact-box ${type === 'gain' ? 'gain' : ''}`;
  box.innerHTML = lines.map(l => `<div class="impact-line">${l}</div>`).join('');
  
  // 優先掛在 impact-area，否則找 panel，否則 game
  let host = $('#impact-area');
  if (!host) {
    const panel = document.querySelector('.panel');
    host = panel || game();
  }
  host.appendChild(box);
  return box;
}

// SAN 損失含動畫
async function loseSanAnimated(amount, reason) {
  const before = state.stats.san;
  state.stats.san = Math.max(0, state.stats.san - amount);
  updateDistortion();
  
  showImpact([
    `<span class="impact-label">理智值</span>　${before} → ${state.stats.san}　<strong style="color:#d4a89a;">−${amount}</strong>`,
    reason ? `<span class="impact-label">原因</span>　${reason}` : ''
  ].filter(Boolean));
  
  // 更新狀態列
  const sb = $('#status-bar');
  if (sb) {
    const newBar = document.createElement('div');
    newBar.innerHTML = statusBar();
    sb.replaceWith(newBar.firstElementChild);
  }
  
  await sleep(800);
}

// 加線索
function addClue(text) {
  if (!state.clues.includes(text)) {
    state.clues.push(text);
    return true;
  }
  return false;
}

// 推進時間
function advanceTime(minutes) {
  state.time += minutes;
}

// 格式化時間（從 23:00 開始算）
function formatTime() {
  const startHour = 23, startMin = 0;
  const totalMin = startHour * 60 + startMin + state.time;
  const h = Math.floor(totalMin / 60) % 24;
  const m = totalMin % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

// ==================== 存檔系統 ====================
// 三層備份：window.storage（持久化）→ sessionStorage（次選）→ window.__lastLetterSaves（記憶體最後備援）
const SAVE_PREFIX = 'last-letter-save:';

async function saveGame(slot = 'auto') {
  const saveData = {
    state: JSON.parse(JSON.stringify(state)),
    timestamp: new Date().toISOString(),
    slot,
  };
  const key = SAVE_PREFIX + slot;
  const json = JSON.stringify(saveData);
  
  // 1. 持久化儲存（artifact 環境支援，跨 session）
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, json);
    }
  } catch (e) {
    console.warn('window.storage 存檔失敗，改用 sessionStorage:', e);
  }
  
  // 2. sessionStorage 同步寫一份（當前分頁可用）
  try {
    if (typeof Storage !== 'undefined' && window.sessionStorage) {
      sessionStorage.setItem(key, json);
    }
  } catch (e) {}
  
  // 3. 記憶體備份
  window.__lastLetterSaves = window.__lastLetterSaves || {};
  window.__lastLetterSaves[slot] = saveData;
  
  return true;
}

async function loadGame(slot = 'auto') {
  const key = SAVE_PREFIX + slot;
  
  // 1. 優先從 window.storage 讀
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const result = await window.storage.get(key);
      if (result && result.value) {
        const data = JSON.parse(result.value);
        Object.assign(state, data.state);
        return data;
      }
    }
  } catch (e) {
    console.warn('window.storage 讀檔失敗:', e);
  }
  
  // 2. sessionStorage 次選
  try {
    if (typeof Storage !== 'undefined' && window.sessionStorage) {
      const raw = sessionStorage.getItem(key);
      if (raw) {
        const data = JSON.parse(raw);
        Object.assign(state, data.state);
        return data;
      }
    }
  } catch (e) {}
  
  // 3. 記憶體最後備援
  if (window.__lastLetterSaves && window.__lastLetterSaves[slot]) {
    const data = window.__lastLetterSaves[slot];
    Object.assign(state, data.state);
    return data;
  }
  
  return null;
}

async function hasSave(slot = 'auto') {
  const info = await getSaveInfo(slot);
  return !!info;
}

async function getSaveInfo(slot = 'auto') {
  const key = SAVE_PREFIX + slot;
  
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const result = await window.storage.get(key);
      if (result && result.value) return JSON.parse(result.value);
    }
  } catch (e) {}
  
  try {
    if (typeof Storage !== 'undefined' && window.sessionStorage) {
      const raw = sessionStorage.getItem(key);
      if (raw) return JSON.parse(raw);
    }
  } catch (e) {}
  
  if (window.__lastLetterSaves && window.__lastLetterSaves[slot]) {
    return window.__lastLetterSaves[slot];
  }
  return null;
}

async function deleteSave(slot = 'auto') {
  const key = SAVE_PREFIX + slot;
  try {
    if (window.storage && typeof window.storage.delete === 'function') {
      await window.storage.delete(key);
    }
  } catch (e) {}
  try {
    if (typeof Storage !== 'undefined' && window.sessionStorage) {
      sessionStorage.removeItem(key);
    }
  } catch (e) {}
  if (window.__lastLetterSaves) delete window.__lastLetterSaves[slot];
}

function autoSave() {
  // 不 await — 自動存檔不阻塞遊戲流程
  saveGame('auto').catch(e => console.warn('autoSave failed:', e));
}

async function continueFromSave(slot = 'auto') {
  const data = await loadGame(slot);
  if (!data) {
    alert('沒有可用的存檔。');
    return;
  }
  resumeScene();
}

function resumeScene() {
  const scene = state.scene;
  if (scene === 'creation') startCharCreation();
  else if (scene === 'arrival') renderArrival();
  else if (scene === 'hall') renderHall();
  else if (scene === 'study') renderStudy();
  else if (scene === 'library') renderLibrary();
  else if (scene === 'bedroom') renderBedroom();
  else if (scene === 'basement') renderBasement();
  else renderHall();
  
  updateDistortion();
}

async function showSaveMenu() {
  const info = await getSaveInfo('auto');
  const manual = await getSaveInfo('manual');
  
  game().innerHTML = `
    ${statusBar()}
    <h1 style="font-size: 1.6em;">存檔 · 讀檔</h1>
    <div class="panel">
      <h2>自動存檔</h2>
      ${info ? `
        <div style="padding: 12px; background: rgba(0,0,0,0.3); margin-bottom: 16px;">
          <div style="color: #8a7d5a; font-size: 0.85em;">時間：${new Date(info.timestamp).toLocaleString('zh-TW')}</div>
          <div style="color: #c9b88a; margin-top: 4px;">場景：${sceneNameMap[info.state.scene] || info.state.scene}　SAN：${info.state.stats.san}/${info.state.stats.sanMax}　線索：${info.state.clues.length}</div>
        </div>
      ` : '<div style="color: #6b5e3a; font-style: italic; margin-bottom: 16px;">無自動存檔</div>'}
      
      <h2 style="margin-top: 24px;">手動存檔</h2>
      ${manual ? `
        <div style="padding: 12px; background: rgba(0,0,0,0.3); margin-bottom: 16px;">
          <div style="color: #8a7d5a; font-size: 0.85em;">時間：${new Date(manual.timestamp).toLocaleString('zh-TW')}</div>
          <div style="color: #c9b88a; margin-top: 4px;">場景：${sceneNameMap[manual.state.scene] || manual.state.scene}　SAN：${manual.state.stats.san}/${manual.state.stats.sanMax}　線索：${manual.state.clues.length}</div>
        </div>
      ` : '<div style="color: #6b5e3a; font-style: italic; margin-bottom: 16px;">無手動存檔</div>'}
      
      <div class="button-row">
        <button onclick="saveManual()">儲存到手動存檔</button>

async function rollAllStats() {
  const buttons = $('#creation-buttons');
  buttons.innerHTML = '<span style="color: #6b5e3a; font-style: italic;">擲骰中…</span>';
  
  // CoC 7e 標準：POW 用 3d6×5 擲，SAN 起始 = POW
  const pow = roll(3,6) * 5;
  const finalStats = {
    pow: pow,
    san: pow,        // 起始 SAN = POW
    int: (roll(2,6) + 6) * 5,
    edu: (roll(2,6) + 6) * 5,
    luck: roll(3,6) * 5,
  };
  
  // 動畫：每個屬性快速跳數字後落定
  // 順序：POW 先擲，SAN 跟著 POW 顯示
  const keys = ['pow', 'san', 'int', 'edu', 'luck'];
  for (const k of keys) {
    const card = $(`#stat-${k}`);
    const val = $(`#val-${k}`);
    card.classList.add('dice-rolling');
    
    if (k === 'san') {
      // SAN 顯示為從 POW 同步
      for (let i = 0; i < 8; i++) {
        val.textContent = Math.floor(Math.random() * 90) + 15;
        await sleep(40);
      }
      val.textContent = finalStats.san;
      // 加個小提示
      const formula = card.querySelector('.stat-formula');
      if (formula) formula.textContent = `= POW (${pow})`;
    } else {
      for (let i = 0; i < 12; i++) {
        val.textContent = Math.floor(Math.random() * 90) + 15;
        await sleep(40);
      }
      val.textContent = finalStats[k];
    }
    card.classList.remove('dice-rolling');
    await sleep(150);
  }
  
  state.stats = { ...finalStats, sanMax: finalStats.san };
  
  // 顯示確認/重骰
  const rerollBtn = state.rerollUsed ? '' : '<button onclick="rerollStats()">重骰一次（僅一次機會）</button>';
  buttons.innerHTML = `
    ${rerollBtn}
    <button onclick="confirmStats()">承擔此命運</button>
  `;
}

async function rerollStats() {
  state.rerollUsed = true;
  await rollAllStats();
}

async function openNecronomicon() {
  game().innerHTML = `
    ${statusBar()}
    <h1 style="font-size: 1.6em;">《死靈之書》</h1>
    <div class="panel">
      <h2>章節目錄</h2>
      <div id="chapters"></div>
      <div class="button-row" style="margin-top: 20px;">
        <button onclick="renderStudy()">闔上書本</button>
      </div>
    </div>
  `;
  
  const list = necronomiconChapters.map((ch, i) => {
    const read = state.chaptersRead.includes(ch.id);
    const locked = state.stats.edu < ch.eduRequired;
    
    if (read) {
      return `<div style="padding: 12px; border-left: 2px solid #4a4028; margin-bottom: 8px; color: #6b5e3a;">
        ✓ ${ch.title}　<small style="font-style: italic;">已讀</small>
      </div>`;
    } else if (locked) {
      return `<div style="padding: 12px; border-left: 2px solid #2a2418; margin-bottom: 8px;" class="chapter-locked">
        ${ch.title}　<small>（需要 EDU ≥ ${ch.eduRequired}，妳的 EDU 為 ${state.stats.edu}）</small>
      </div>`;
    } else {
      return `<div style="padding: 12px; margin-bottom: 8px;">
        <button onclick="readChapter(${ch.id})" style="width: 100%; text-align: left;">
          ${ch.title}<br>
          <small style="color: #8a7d5a;">扣 SAN：${ch.sanLoss}</small>
        </button>
      </div>`;
    }
  }).join('');
  
  $('#chapters').innerHTML = list;
}

async function readChapter(id) {
  const ch = necronomiconChapters[id];
  state.chaptersRead.push(id);
  advanceTime(10);
  
  // 計算 SAN 損失
  const [n, s] = ch.sanLoss.split('d').map(Number);
  const loss = roll(n, s);
  
  game().innerHTML = `
    ${statusBar()}
    <h1 style="font-size: 1.6em;">${ch.title}</h1>
    <div class="letter">
      <p id="ch-text"></p>
    </div>
    <div id="impact-area"></div>
    <div class="button-row" id="actions" style="margin-top: 20px;"></div>
  `;
  
  await typeText($('#ch-text'), corrupt(ch.text), 22);
  
  await loseSanAnimated(loss, `閱讀${ch.title}（扣 ${ch.sanLoss} = ${loss}）`);
  addClue(ch.clue);
  
  // SAN 歸零判定
  if (state.stats.san <= 0) {
    $('#actions').innerHTML = `<button onclick="endingAssimilation()">……</button>`;
    return;
  }
  
  $('#actions').innerHTML = `<button onclick="openNecronomicon()">闔上此章</button>`;
}

// ==================== 結局判定 ====================

function tryEscape() {
  // 結局分流
  if (state.chaptersRead.length === 5) {
    endingWitness();
  } else if (state.flags.bookBurned) {
    endingEscape();
  } else if (state.clues.length >= 5 && state.stats.san >= 30) {
    endingEscape();
  } else {
    endingSilence();
  }
}

function checkTimeOut() {
  if (state.time >= state.timeLimit) {
    endingTimeout();
    return true;
  }
  return false;
}

async function restart() {
  // 重置所有狀態
  state.scene = 'title';
  state.stats = { san: 0, sanMax: 0, int: 0, edu: 0, pow: 0, luck: 0 };
  state.rerollUsed = false;
  state.time = 0;
  state.clues = [];
  state.visited = {};
  state.flags = {};
  state.chaptersRead = [];
  // 清除自動存檔（保留手動存檔）
  await deleteSave('auto');
  $('#distortion').style.opacity = '0';
  $('#noise').style.opacity = '0';
  renderTitle();
}

// ==================== 啟動 ====================
