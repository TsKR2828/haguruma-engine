<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歯車 — 原型 v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap');

  :root {
    --washi-bg-outer:   #D5CCBC;
    --washi-bg-sidebar: #E8E0D0;
    --washi-bg-main:    #FAF7F2;
    --washi-bg-card:    #FFFFFF;

    --washi-ink-deep:   #2C2418;
    --washi-ink-body:   #4A3F33;
    --washi-ink-muted:  #8B7E6E;
    --washi-ink-ghost:  #B5AA98;

    --washi-border:       #C8BFA8;
    --washi-border-light: #DDD6C6;
    --washi-divider:      #E0D9CA;

    --washi-accent-red:   #8E3B2A;
    --washi-accent-gold:  #C9A86A;
    --washi-accent-green: #5B7A5E;
    --washi-accent-blue:  #4A6B7A;

    --washi-hover-bg:     #F0EBE1;
    --washi-active-bg:    #E8E0D0;
    --washi-selection:    rgba(201, 168, 106, 0.2);
  }

  ::selection {
    background: var(--washi-selection);
    color: var(--washi-ink-deep);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Serif TC', 'Noto Serif JP', Georgia, serif;
    background: var(--washi-bg-outer);
    color: var(--washi-ink-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #distortion {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 100;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(60,30,10,0.35) 100%);
    opacity: 0; transition: opacity 1.5s;
  }

  #noise {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 99; opacity: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.65' numOctaves='4'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.25'/></svg>");
    transition: opacity 1s;
    mix-blend-mode: multiply;
  }

  /* ── 3-column layout ── */
  .layout {
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
    max-width: 1280px;
    margin: 0 auto;
  }
  .layout-left, .layout-right {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 16px;
    flex: 0 0 auto;
    z-index: 5;
    scrollbar-width: thin;
    scrollbar-color: rgba(160,140,110,0.3) transparent;
  }
  .layout-left::-webkit-scrollbar, .layout-right::-webkit-scrollbar { width: 4px; }
  .layout-left::-webkit-scrollbar-thumb, .layout-right::-webkit-scrollbar-thumb {
    background: rgba(160,140,110,0.3); border-radius: 2px;
  }
  .layout-left::-webkit-scrollbar-track, .layout-right::-webkit-scrollbar-track { background: transparent; }

  .layout-left  {
    flex-basis: 200px;
    background: var(--washi-bg-sidebar);
    border-right: 1px solid var(--washi-border);
  }
  .layout-right {
    flex-basis: 280px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        rgba(160, 140, 110, 0.08) 27px,
        rgba(160, 140, 110, 0.08) 28px
      ),
      var(--washi-bg-sidebar);
    border-left: 1px solid var(--washi-border);
  }
  .layout-center {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    justify-content: center;
    background: var(--washi-bg-main);
    box-shadow: 0 0 24px rgba(60,50,35,0.10), 0 0 6px rgba(60,50,35,0.05);
  }
  @media (max-width: 1100px) {
    .layout-left, .layout-right { display: none; }
  }

  #game {
    width: 100%;
    max-width: 640px; margin: 0; padding: 20px;
    min-height: 100vh; position: relative;
  }

  /* ── Left: chapter panel (和紙) ── */
  .ch-header {
    cursor: pointer;
    color: var(--washi-ink-body);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 8px 0;
    border-bottom: 1px solid var(--washi-border);
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s;
  }
  .ch-header:hover { color: var(--washi-ink-deep); }
  .ch-header .ch-arrow {
    font-size: 9px;
    transition: transform 0.3s;
    color: var(--washi-ink-muted);
  }
  .ch-header.expanded .ch-arrow { transform: rotate(180deg); color: var(--washi-ink-deep); }

  .ch-warning {
    color: var(--washi-ink-muted);
    font-size: 11px;
    line-height: 1.85;
    font-style: italic;
    padding: 6px 4px;
    letter-spacing: 0.04em;
  }

  .ch-list { display: none; }
  .ch-list.expanded { display: block; }

  .ch-item {
    padding: 10px 10px 10px 14px;
    margin-bottom: 4px;
    font-size: 13px;
    color: var(--washi-ink-ghost);
    border-left: 1px solid transparent;
    transition: all 0.2s;
  }
  .ch-item.unlocked { color: var(--washi-ink-body); border-left-color: var(--washi-border); }
  .ch-item.current {
    color: var(--washi-ink-deep);
    border-left-color: var(--washi-accent-gold);
    background: rgba(201,168,106,0.08);
  }
  .ch-item-num {
    color: var(--washi-ink-body);
    font-size: 10px;
    letter-spacing: 0.25em;
    display: block;
    margin-bottom: 3px;
  }
  .ch-item.current .ch-item-num { color: var(--washi-accent-gold); }

  /* ── Right: side sections ── */
  .right-section {
    margin-bottom: 24px;
    padding: 16px 14px 12px;
    background: rgba(250, 247, 242, 0.4);
    border: 1px solid var(--washi-border);
    border-radius: 2px;
    position: relative;
  }
  .right-section::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--washi-divider);
  }
  .right-section-header {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--washi-ink-deep);
    border-bottom: 1px solid var(--washi-border-light);
    padding-bottom: 6px;
    margin-bottom: 12px;
    padding-left: 8px;
  }

  /* Mini-map (clickable preview) */
  #mini-map-container {
    cursor: pointer;
    position: relative;
    transition: filter 0.2s;
  }
  #mini-map-container:hover { filter: brightness(1.25); }
  #mini-map-container::after {
    content: '展開';
    position: absolute;
    top: 6px; right: 6px;
    font-size: 9px;
    color: var(--washi-ink-body);
    letter-spacing: 0.15em;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #mini-map-container:hover::after { opacity: 1; }

  /* Mini-notebook entries (和紙) */
  .mini-nb-entry {
    padding: 10px 12px 10px 14px;
    font-size: 12px;
    color: var(--washi-ink-body);
    border-left: 2px solid var(--washi-accent-gold);
    margin-bottom: 6px;
    background: rgba(250, 247, 242, 0.35);
    line-height: 1.65;
    transition: all 0.4s;
    position: relative;
    border-radius: 1px;
  }
  .mini-nb-entry .nb-icon {
    margin-right: 6px;
    color: var(--washi-accent-gold);
  }
  .mini-nb-entry:hover {
    background: var(--washi-hover-bg);
    border-left-color: var(--washi-ink-deep);
  }
  .mini-nb-entry.connection-source {
    border-left-color: var(--washi-accent-gold);
    background: rgba(201, 168, 106, 0.12);
    box-shadow: 0 0 8px rgba(201,168,106,0.15);
  }
  .mini-nb-empty {
    color: var(--washi-ink-muted);
    font-size: 12px;
    font-style: italic;
    padding: 8px 14px;
    letter-spacing: 0.04em;
  }

  /* Connection cards (和紙) */
  .connection-card {
    padding: 12px 14px;
    background: rgba(250, 247, 242, 0.35);
    border: 1px solid var(--washi-border);
    border-left: 2px solid var(--washi-accent-gold);
    position: relative;
    margin-bottom: 8px;
    animation: connectionAppear 0.8s ease-out;
    border-radius: 1px;
  }
  .connection-card:hover {
    background: var(--washi-hover-bg);
  }
  .connection-card-icon {
    color: var(--washi-accent-gold);
    font-size: 14px;
    margin-bottom: 4px;
    letter-spacing: 0.1em;
  }
  .connection-card-title {
    color: var(--washi-ink-deep);
    font-size: 13px;
    margin-bottom: 3px;
    letter-spacing: 0.04em;
    font-family: 'Noto Serif TC', 'Noto Serif JP', serif;
  }
  .connection-card-subtitle {
    color: var(--washi-ink-muted);
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0.05em;
  }
  @keyframes connectionAppear {
    0% { opacity: 0; transform: translateY(12px) scale(0.94); }
    50% { opacity: 0.5; }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .connection-toast {
    position: fixed;
    top: 80px;
    right: 30px;
    padding: 6px 14px;
    background: rgba(44,36,24,0.95);
    border: 1px solid var(--washi-accent-gold);
    color: #e8d5a8;
    font-size: 11px;
    letter-spacing: 0.2em;
    pointer-events: none;
    z-index: 150;
    animation: connToast 3s ease-out forwards;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  @keyframes connToast {
    0% { opacity: 0; transform: translateX(20px); }
    15% { opacity: 1; transform: translateX(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-8px); }
  }

  .conn-empty {
    color: var(--washi-ink-muted);
    font-size: 12px;
    font-style: italic;
    padding: 8px 14px;
    line-height: 1.7;
    letter-spacing: 0.04em;
  }

  /* ── Status bar (和紙) ── */
  #status {
    position: sticky; top: 0; z-index: 10;
    background: rgba(250,247,242,0.95); backdrop-filter: blur(4px);
    border-bottom: 1px solid var(--washi-border);
    padding: 10px 0; margin-bottom: 24px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--washi-ink-muted); letter-spacing: 0.08em;
  }
  .stat-group { display: flex; gap: 16px; }
  .stat-val { color: var(--washi-ink-deep); }
  .stat-val.danger { color: var(--washi-accent-red); }
  #notebook-btn {
    background: none; border: 1px solid var(--washi-border); color: var(--washi-ink-muted);
    padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
    letter-spacing: 0.08em;
  }
  #notebook-btn:hover { border-color: var(--washi-accent-gold); color: var(--washi-ink-deep); }

  /* ── Text types (和紙) ── */
  .narration { color: var(--washi-ink-body); line-height: 1.9; font-size: 15px; margin-bottom: 12px; letter-spacing: 0.03em; }
  .inner { color: var(--washi-accent-blue); line-height: 1.9; font-size: 15px; font-style: italic; margin-bottom: 12px; }
  .dialogue { color: var(--washi-ink-deep); line-height: 1.9; font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; }
  .speaker { color: var(--washi-ink-muted); font-size: 12px; display: block; margin-bottom: 2px; letter-spacing: 0.08em; }
  .system-msg { color: var(--washi-accent-green); font-size: 13px; padding: 6px 12px; border-left: 2px solid var(--washi-accent-green); margin: 8px 0; }
  .choice-made { color: var(--washi-ink-muted); font-size: 13px; font-style: italic; margin-bottom: 10px; }

  .typing-cursor::after {
    content: '▍'; color: var(--washi-ink-muted); opacity: 0.5; animation: blink 1s infinite;
  }
  @keyframes blink { 0%,50%{opacity:0.5} 51%,100%{opacity:0} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* ── Scene fold system ── */
  .scene-block {
    position: relative;
  }

  .fold-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(
      to top,
      rgba(250,247,242,0.95) 0%,
      rgba(250,247,242,0.7) 30%,
      rgba(250,247,242,0.15) 65%,
      transparent 100%
    );
    opacity: 0;
    animation: foldFadeIn 0.3s ease forwards;
  }
  .fold-overlay::before,
  .fold-overlay::after {
    content: '';
    position: absolute;
    left: 8%; right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(160,140,110,0.15), transparent);
  }
  .fold-overlay::before { top: 33%; }
  .fold-overlay::after { top: 66%; }

  @keyframes foldFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .fold-summary {
    padding: 7px 16px;
    color: var(--washi-ink-muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    position: relative;
    background: rgba(232,224,208,0.4);
    border: 1px solid var(--washi-border);
    margin-bottom: 16px;
    transition: all 0.25s;
    box-shadow: 0 2px 6px rgba(100,80,50,0.06);
  }
  .fold-summary:hover {
    color: var(--washi-ink-body);
    border-color: var(--washi-accent-gold);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(100,80,50,0.10);
  }
  .fold-summary .fold-arrow {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--washi-ink-ghost);
    transition: transform 0.3s;
  }
  .fold-summary.expanded .fold-arrow {
    transform: translateY(-50%) rotate(180deg);
  }
  .scene-block.fold-expanded {
    opacity: 0.5;
    border-left: 1px solid var(--washi-border-light);
    padding-left: 12px;
    margin-bottom: 8px;
  }

  /* ── Click to advance (和紙) ── */
  .click-continue {
    text-align: center;
    color: var(--washi-ink-ghost);
    font-size: 10px;
    padding: 12px 0 4px;
    animation: clickPulse 2.5s ease infinite;
    user-select: none;
  }
  @keyframes clickPulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

  /* ── Choices (和紙) ── */
  .choices { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.5s; }
  .choices-label { color: var(--washi-ink-muted); font-size: 11px; letter-spacing: 0.15em; margin-bottom: 4px; }
  .choice-btn {
    background: var(--washi-bg-card); border: 1px solid var(--washi-border); color: var(--washi-ink-deep);
    padding: 12px 16px; font-size: 14px; line-height: 1.6; text-align: left;
    cursor: pointer; font-family: inherit; transition: all 0.2s; letter-spacing: 0.02em;
  }
  .choice-btn:hover { background: var(--washi-hover-bg); border-color: var(--washi-accent-gold); }

  /* ── Action (和紙) ── */
  .action-btn {
    display: inline-block; background: none; border: 1px solid var(--washi-accent-green);
    color: var(--washi-accent-green); padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; margin: 8px 0; transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .action-btn:hover { background: rgba(91,122,94,0.08); border-color: var(--washi-accent-green); }

  /* ── Forced steps (和紙) ── */
  .forced-wrapper { position: relative; display: inline-block; margin: 6px 0; }
  .forced-btn {
    background: var(--washi-bg-card); border: 1px solid var(--washi-border); color: var(--washi-ink-body);
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-family: inherit;
    position: relative; z-index: 2; transition: all 0.2s; letter-spacing: 0.03em;
  }
  .forced-btn:hover { background: var(--washi-hover-bg); border-color: var(--washi-accent-gold); }
  .forced-btn.eroded { clip-path: polygon(0% 5%,2% 0%,5% 6%,8% 0%,11% 5%,14% 0%,17% 4%,20% 0%,23% 5%,26% 0%,29% 6%,32% 0%,35% 5%,38% 0%,41% 4%,44% 0%,47% 5%,50% 0%,53% 6%,56% 0%,59% 5%,62% 0%,65% 4%,68% 0%,71% 5%,74% 0%,77% 6%,80% 0%,83% 5%,86% 0%,89% 4%,92% 0%,95% 5%,98% 0%,100% 5%,100% 95%,98% 100%,95% 94%,92% 100%,89% 96%,86% 100%,83% 95%,80% 100%,77% 94%,74% 100%,71% 95%,68% 100%,65% 96%,62% 100%,59% 95%,56% 100%,53% 94%,50% 100%,47% 95%,44% 100%,41% 96%,38% 100%,35% 95%,32% 100%,29% 94%,26% 100%,23% 95%,20% 100%,17% 96%,14% 100%,11% 95%,8% 100%,5% 94%,2% 100%,0% 95%); }
  .forced-btn.eroded-deep { clip-path: polygon(0% 8%,3% 0%,7% 10%,11% 0%,15% 8%,19% 0%,23% 10%,27% 0%,31% 8%,35% 0%,39% 10%,43% 0%,47% 8%,50% 0%,53% 8%,57% 0%,61% 10%,65% 0%,69% 8%,73% 0%,77% 10%,81% 0%,85% 8%,89% 0%,93% 10%,97% 0%,100% 8%,100% 92%,97% 100%,93% 90%,89% 100%,85% 92%,81% 100%,77% 90%,73% 100%,69% 92%,65% 100%,61% 90%,57% 100%,53% 92%,50% 100%,47% 92%,43% 100%,39% 90%,35% 100%,31% 92%,27% 100%,23% 90%,19% 100%,15% 92%,11% 100%,7% 90%,3% 100%,0% 92%); }
  .gear-pattern {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1; pointer-events: none; overflow: hidden; border-radius: 2px;
  }
  .gear-spin {
    position: absolute; top: 50%; left: 50%; transform-origin: center;
    opacity: 0; pointer-events: none;
  }
  @keyframes gearRotate { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }

  /* ── Impact (和紙) ── */
  .impact { padding: 10px 14px; margin: 10px 0; font-size: 13px; animation: fadeIn 0.4s; }
  .impact.loss { background: rgba(142,59,42,0.06); border-left: 3px solid var(--washi-accent-red); color: var(--washi-accent-red); }
  .impact.gain { background: rgba(91,122,94,0.06); border-left: 3px solid var(--washi-accent-green); color: var(--washi-accent-green); }
  .impact-label { color: var(--washi-ink-muted); font-size: 12px; letter-spacing: 0.08em; }

  /* ── Notebook overlay ── */
  #notebook-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(60,50,35,0.85); z-index: 200;
    display: none; justify-content: center; align-items: center;
    animation: fadeIn 0.3s;
  }
  #notebook-overlay.open { display: flex; }
  #notebook-panel {
    background: var(--washi-bg-card); border: 1px solid var(--washi-border); padding: 28px;
    max-width: 460px; width: 90%; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(60,50,35,0.3);
  }
  .nb-title { color: var(--washi-ink-body); font-size: 14px; letter-spacing: 0.2em; margin-bottom: 16px; border-bottom: 1px solid var(--washi-border-light); padding-bottom: 10px; }
  .nb-group-label { color: var(--washi-ink-muted); font-size: 12px; margin-bottom: 6px; letter-spacing: 0.1em; }
  .nb-entry { color: var(--washi-ink-body); font-size: 13px; line-height: 1.6; padding-left: 14px; border-left: 1px solid var(--washi-accent-gold); margin-bottom: 4px; }
  .nb-close { background: none; border: 1px solid var(--washi-border); color: var(--washi-ink-muted); padding: 5px 14px; font-size: 12px; cursor: pointer; margin-top: 14px; font-family: inherit; }

  /* ── Map overlay ── */
  #map-btn {
    background: none; border: 1px solid var(--washi-border); color: var(--washi-ink-muted);
    padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
    letter-spacing: 0.08em; margin-right: 8px;
  }
  #map-btn:hover { border-color: var(--washi-accent-gold); color: var(--washi-ink-deep); }

  #map-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(60,50,35,0.85); z-index: 200;
    display: none; justify-content: center; align-items: center;
    animation: fadeIn 0.4s;
  }
  #map-overlay.open { display: flex; }
  #map-panel {
    background: var(--washi-bg-card);
    border: 1px solid var(--washi-border);
    padding: 24px;
    max-width: 380px; width: 92%;
    max-height: 88vh; overflow-y: auto;
    position: relative;
    box-shadow: 0 8px 40px rgba(60,50,35,0.3);
  }
  .map-title {
    color: var(--washi-accent-gold);
    font-size: 12px;
    letter-spacing: 0.25em;
    text-align: center;
    margin-bottom: 6px;
    font-family: 'Noto Serif TC', 'Noto Serif JP', serif;
  }
  .map-subtitle {
    color: var(--washi-ink-muted);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-align: center;
    margin-bottom: 16px;
    font-style: italic;
  }
  .map-svg { width: 100%; height: auto; display: block; }

  @keyframes mapPulse {
    0%, 100% { r: 6; opacity: 0.5; }
    50%      { r: 16; opacity: 0; }
  }

  .map-loc-current circle.pulse {
    animation: mapPulse 2.4s ease-out infinite;
  }

  /* ── End overlay ── */

// ══════════════════ AUDIO SYSTEM ══════════════════
// Web Audio API 基礎架構。音檔以 URL 載入，支援：
//   playAmbient(url, { loop, fadeIn }) — 環境音（同時僅一條，切換自動 crossfade）
//   playSfx(url)                       — 一次性效果音
//   stopAmbient(fadeOut)               — 淡出環境音
// 場景資料可加 audio: { ambient: 'url', sfx: ['url'] }

let _audioCtx = null;
let _ambientSource = null;
let _ambientGain = null;
const _audioCache = {};

function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

async function fetchAudioBuffer(url) {
  if (_audioCache[url]) return _audioCache[url];
  try {
    const ctx = getAudioCtx();
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    const decoded = await ctx.decodeAudioData(buf);
    _audioCache[url] = decoded;
    return decoded;
  } catch (e) {
    console.warn('Audio load failed:', url, e);
    return null;
  }
}

async function playAmbient(url, { loop = true, fadeIn = 1.5 } = {}) {
  if (!url) return;
  const ctx = getAudioCtx();
  const buffer = await fetchAudioBuffer(url);
  if (!buffer) return;

  // Crossfade: fade out previous
  if (_ambientSource) stopAmbient(1.0);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(settings.ambientVol, ctx.currentTime + fadeIn);
  gain.connect(ctx.destination);

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = loop;
  source.connect(gain);
  source.start();

  _ambientSource = source;
  _ambientGain = gain;
}

function stopAmbient(fadeOut = 1.5) {
  if (!_ambientGain || !_ambientSource) return;
  const ctx = getAudioCtx();
  const g = _ambientGain;
  const s = _ambientSource;
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeOut);
  setTimeout(() => { try { s.stop(); } catch (e) {} }, fadeOut * 1000 + 100);
  _ambientSource = null;
  _ambientGain = null;
}

async function playSfx(url) {
  if (!url || settings.sfxVol <= 0) return;
  const ctx = getAudioCtx();
  const buffer = await fetchAudioBuffer(url);
  if (!buffer) return;

  const gain = ctx.createGain();
  gain.gain.value = settings.sfxVol;
  gain.connect(ctx.destination);

  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(gain);
  source.start();
}

function audioUpdateVolumes() {
  if (_ambientGain) {
    const ctx = getAudioCtx();
    _ambientGain.gain.linearRampToValueAtTime(settings.ambientVol, ctx.currentTime + 0.3);
  }
}

function corrupt(text) {
  const ratio = state.nerve / 10;
  if (ratio > 0.5) return text;
  const chars = '̷̧̢̡̕͝͞҉̴̶̸͍̩̭̮̯̪̟̱̬̜̦̤̳';
  const intensity = (0.5 - ratio) * 2;
  return text.split('').map(c => {
    if (Math.random() < intensity * 0.15 && c.trim())
      return c + chars[Math.floor(Math.random() * chars.length)];
    return c;
  }).join('');
}

async function foldCurrentScene(summary) {
  if (!currentSceneEl) return;
  const sceneEl = currentSceneEl;
  currentSceneEl = null;

  const height = sceneEl.offsetHeight;
  sceneEl.style.maxHeight = height + 'px';
  sceneEl.style.overflow = 'hidden';
  sceneEl.style.position = 'relative';

  const overlay = document.createElement('div');
  overlay.className = 'fold-overlay';
  sceneEl.appendChild(overlay);

  void sceneEl.offsetHeight;

  sceneEl.style.transition = 'max-height 0.7s ease, opacity 0.5s ease';
  sceneEl.style.maxHeight = '0px';
  sceneEl.style.opacity = '0';

  await sleep(750);

  sceneEl.style.display = 'none';
  sceneEl.style.transition = '';
  sceneEl.style.maxHeight = '';
  sceneEl.style.opacity = '';
  sceneEl.style.overflow = '';
  overlay.remove();

  const foldEl = document.createElement('div');
  foldEl.className = 'fold-summary';
  foldEl.innerHTML = `<span>${summary}</span><span class="fold-arrow">∨</span>`;
  foldEl.addEventListener('click', () => toggleFold(foldEl, sceneEl));
  sceneEl.before(foldEl);
}

function toggleFold(foldEl, sceneEl) {
  const isHidden = sceneEl.style.display === 'none';

  if (isHidden) {
    sceneEl.style.display = '';
    sceneEl.style.opacity = '0';
    sceneEl.style.overflow = 'hidden';
    sceneEl.style.maxHeight = '0px';
    sceneEl.classList.add('fold-expanded');

    void sceneEl.offsetHeight;
    sceneEl.style.transition = 'max-height 0.6s ease, opacity 0.4s ease';
    sceneEl.style.maxHeight = sceneEl.scrollHeight + 'px';
    sceneEl.style.opacity = '0.45';

    foldEl.classList.add('expanded');

    setTimeout(() => {
      sceneEl.style.maxHeight = 'none';
      sceneEl.style.transition = '';
      sceneEl.style.overflow = '';
    }, 620);
  } else {
    const h = sceneEl.offsetHeight;
    sceneEl.style.maxHeight = h + 'px';
    sceneEl.style.overflow = 'hidden';

    void sceneEl.offsetHeight;
    sceneEl.style.transition = 'max-height 0.6s ease, opacity 0.3s ease';
    sceneEl.style.maxHeight = '0px';
    sceneEl.style.opacity = '0';

    foldEl.classList.remove('expanded');

    setTimeout(() => {
      sceneEl.style.display = 'none';
      sceneEl.classList.remove('fold-expanded');
      sceneEl.style.transition = '';
      sceneEl.style.maxHeight = '';
      sceneEl.style.opacity = '';
      sceneEl.style.overflow = '';
    }, 620);
  }
}

// ══════════════════ CLICK-TO-ADVANCE ══════════════════
const INTERACTIVE_SELECTOR = 'button, .choices, .action-btn, .forced-btn, .forced-wrapper, #status, #notebook-overlay, #end-overlay, #map-overlay, #settings-overlay, .fold-summary, .layout-left, .layout-right, .ch-header, .ch-item, #mini-map-container, .mini-nb-entry, .connection-card';

async function typeText(el, text, speed) {
  const spd = speed ?? settings.textSpeed;
  el.textContent = '';
  el.classList.add('typing-cursor');

  let skipped = false;
  function skipHandler(e) {
    if (e.target.closest(INTERACTIVE_SELECTOR)) return;
    skipped = true;
  }
  document.addEventListener('click', skipHandler);

  if (spd <= 0) {
    el.textContent = text;
  } else {
    for (let i = 0; i < text.length; i++) {
      if (skipped) { el.textContent = text; break; }
      el.textContent += text[i];
      await sleep(spd);
    }
  }

  document.removeEventListener('click', skipHandler);
  el.classList.remove('typing-cursor');
  scrollToBottom();
}

async function waitForClick() {
  return new Promise(resolve => {
    const indicator = document.createElement('div');
    indicator.className = 'click-continue';
    indicator.textContent = settings.autoAdvance ? '▶' : '▼';
    currentSceneEl.appendChild(indicator);
    scrollToBottom();

    let autoTimer = null;
    if (settings.autoAdvance) {
      autoTimer = setTimeout(() => { cleanup(); resolve(); }, settings.autoDelay);
    }

    function handler(e) {
      if (e.target.closest(INTERACTIVE_SELECTOR)) return;
      cleanup();
      resolve();
    }
    function keyHandler(e) {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        cleanup();
        resolve();
      }
    }
    function cleanup() {
      if (autoTimer) clearTimeout(autoTimer);
      indicator.remove();
      document.removeEventListener('click', handler);
      document.removeEventListener('keydown', keyHandler);
    }
    document.addEventListener('click', handler);
    document.addEventListener('keydown', keyHandler);
  });
}

async function typeAndWait(el, text, speed = 18) {
  await typeText(el, text, speed);
  await sleep(120);
  await waitForClick();
}

        <div id="status-nerve-bar-root"></div>

function addNotebook(key, symbol, desc) {
  if (state.notebook.find(n => n.key === key)) return;
  state.notebook.push({ key, symbol, desc });
  renderMiniNotebook();
  // Schedule connection check after the entry settles
  setTimeout(() => checkConnections(), 600);
}

function openNotebook() {
  const grouped = {};
  state.notebook.forEach(e => {
    if (!grouped[e.symbol]) grouped[e.symbol] = [];
    grouped[e.symbol].push(e);
  });
  let html = '';
  for (const [sym, items] of Object.entries(grouped)) {
    const s = SYMBOLS[sym];
    html += `<div class="nb-group-label">${s?.icon || ''} ${s?.system || sym}</div>`;
    items.forEach(it => { html += `<div class="nb-entry">${it.desc}</div>`; });
    html += '<div style="height:12px"></div>';
  }
  if (state.notebook.length === 0) html = '<div style="color:#8B7E6E;font-size:13px">尚無記錄。</div>';
  $('#nb-content').innerHTML = html;
  $('#notebook-overlay').classList.add('open');
}

function closeNotebook() {
  $('#notebook-overlay').classList.remove('open');
}

$('#notebook-overlay').addEventListener('click', (e) => {
  if (e.target === $('#notebook-overlay')) closeNotebook();
});

function renderMiniMap() {
  const W = 240, H = 280;
  const locs = LOCATIONS.map(l => ({ ...l, x: l.x * 0.78, y: (l.y - 40) * 0.7 + 20 }));
  const path = buildJourneyPath(locs);

  let locsHTML = '';
  locs.forEach(loc => {
    const status = locStatus(loc);

    const isVisited = status === 'visited';
    const fillColor = isCurrent ? '#C9A86A' : isVisited ? '#8B7E6E' : '#DDD6C6';
    const strokeColor = isCurrent ? '#4A3F33' : '#C8BFA8';

    if (loc.shape === 'rect') {
      shape = `<rect x="${loc.x - 4}" y="${loc.y - 4}" width="8" height="8" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.2 : 0.8}"/>`;
    } else if (loc.shape === 'mountain') {
      shape = `<path d="M ${loc.x - 5} ${loc.y + 4} L ${loc.x} ${loc.y - 5} L ${loc.x + 5} ${loc.y + 4} Z" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.2 : 0.8}"/>`;

      shape = `<circle cx="${loc.x}" cy="${loc.y}" r="3.5" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.2 : 0.8}"/>`;
    }

    const pulse = isCurrent
      ? `<circle cx="${loc.x}" cy="${loc.y}" r="5" fill="none" stroke="#C9A86A" opacity="0.5">
           <animate attributeName="r" values="5;14;5" dur="2.4s" repeatCount="indefinite"/>
           <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
         </circle>` : '';

    locsHTML += `<g>${pulse}${shape}<text x="${loc.x + 9}" y="${loc.y + 3}" fill="${labelColor}" font-size="9" font-family="'Noto Serif TC', serif">${labelText}</text></g>`;
  });

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
      <rect width="${W}" height="${H}" fill="#FAF7F2"/>
      <rect width="${W}" height="${H}" opacity="0.3">

      </rect>

// ══════════════════ CONNECTION SYSTEM ══════════════════

async function checkConnections() {
  for (const conn of CONNECTIONS) {
    if (state.connections.includes(conn.id)) continue;
    let met = false;
    if (typeof conn.check === 'function') {
      met = conn.check(state);
    } else if (conn.requires) {
      met = conn.requires.every(req =>
        state.notebook.some(n => n.key === req)
      );
    }
    if (met) {
      await formConnection(conn);
    }
  }
}

async function formConnection(conn) {
  // 1. Highlight source cards (pulse) — requires may be absent for check-based connections
  (conn.requires || []).forEach(reqKey => {
    const card = document.querySelector(`.mini-nb-entry[data-key="${reqKey}"]`);
    if (card) {
      card.classList.add('connection-source');
      setTimeout(() => card.classList.remove('connection-source'), 2800);
    }
  });

  // 2. Toast: ✦ 連結
  const toast = document.createElement('div');
  toast.className = 'connection-toast';
  toast.textContent = '✦  連結';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3100);

  await sleep(1200);

  // 3. Add new card to state + render
  state.connections.push(conn.id);
  renderConnections();

  // 4. Stat gain (insight)
  if (conn.insightGain) {
    state.insight += conn.insightGain;
    updateStatus();
    dispatchHgrState();
    dispatchHgrImpact({ type: 'gain', label: '洞察', amount: conn.insightGain, reason: conn.title });
    showImpact(
      `<span class="impact-label">洞察</span>　+${conn.insightGain}　${conn.title}`,
      'gain'
    );
  }
}

// ══════════════════ MAP / JOURNEY ══════════════════

function visitLocation(id) {
  const cur = state.journey.current;
  if (cur && cur !== id && !state.journey.visited.includes(cur)) {
    state.journey.visited.push(cur);
  }
  state.journey.current = id;
  renderMiniMap();
  if ($('#map-overlay').classList.contains('open')) renderMap();
}

function unlockSymbol(key) {
  state.journey.symbols[key] = true;
  renderMiniMap();
  if ($('#map-overlay').classList.contains('open')) renderMap();
}

function locStatus(loc) {
  if (state.journey.current === loc.id) return 'current';
  if (state.journey.visited.includes(loc.id)) return 'visited';
  return 'unseen';
}

function buildJourneyPath(locs) {
  let p = `M ${locs[0].x} ${locs[0].y}`;
  for (let i = 1; i < locs.length; i++) {
    const prev = locs[i-1];
    const cur = locs[i];
    const mx = (prev.x + cur.x) / 2;
    const my = (prev.y + cur.y) / 2;
    const offset = (i % 2 === 0) ? -12 : 14;
    p += ` Q ${mx + offset} ${my + 6} ${cur.x} ${cur.y}`;
  }
  return p;
}

function renderMap() {
  const W = 320, H = 420;
  const path = buildJourneyPath(LOCATIONS);

  // Find how far along the journey we are (for path coloring)
  const reachedIndex = LOCATIONS.findIndex(l => l.id === state.journey.current);

  let locsHTML = '';
  LOCATIONS.forEach((loc, i) => {
    const status = locStatus(loc);
    const isCurrent = status === 'current';
    const isVisited = status === 'visited';
    const isUnseen = status === 'unseen';

    const fillColor = isCurrent ? '#C9A86A' : isVisited ? '#8B7E6E' : '#DDD6C6';
    const strokeColor = isCurrent ? '#4A3F33' : isVisited ? '#8B7E6E' : '#B5AA98';
    const labelColor = isCurrent ? '#2C2418' : isVisited ? '#4A3F33' : '#B5AA98';
    const subColor   = isCurrent ? '#8B7E6E' : isVisited ? '#B5AA98' : '#DDD6C6';
    const labelText = isUnseen ? '? ? ?' : loc.label;
    const subText = isUnseen ? '' : loc.sub;

    let shape;
    if (loc.shape === 'rect') {
      shape = `<rect x="${loc.x - 5}" y="${loc.y - 5}" width="10" height="10" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.5 : 1}"/>`;
    } else if (loc.shape === 'mountain') {
      shape = `<path d="M ${loc.x - 6} ${loc.y + 5} L ${loc.x} ${loc.y - 6} L ${loc.x + 6} ${loc.y + 5} Z" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.5 : 1}"/>`;
    } else {
      shape = `<circle cx="${loc.x}" cy="${loc.y}" r="4" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isCurrent ? 1.5 : 1}"/>`;
    }

    // Symbol marker (only if collected)
    let symbolMarker = '';
    if (loc.symbolKey && state.journey.symbols[loc.symbolKey]) {
      const sym = SYMBOL_GLYPHS[loc.symbolKey];
      symbolMarker = `<text x="${loc.x + 14}" y="${loc.y + 18}" fill="#C9A86A" font-size="11" font-family="serif">${sym.glyph}</text>`;
    }

    // Pulse for current
    const pulseHTML = isCurrent
      ? `<circle class="pulse" cx="${loc.x}" cy="${loc.y}" r="6" fill="none" stroke="#C9A86A" stroke-width="1" opacity="0.5"/>`
      : '';

    locsHTML += `<g class="map-loc map-loc-${status}${isCurrent ? ' map-loc-current' : ''}">
      ${pulseHTML}
      ${shape}
      <text x="${loc.x + 12}" y="${loc.y - 2}" fill="${labelColor}" font-size="11" font-family="'Noto Serif TC', serif" letter-spacing="0.05em">${labelText}</text>
      ${subText ? `<text x="${loc.x + 12}" y="${loc.y + 9}" fill="${subColor}" font-size="8" font-family="serif" font-style="italic">${subText}</text>` : ''}
      ${symbolMarker}
    </g>`;
  });

  // Travel mode labels along the path (between consecutive locations)
  const travelModes = ['汽車', '東海道線', '省線電車', '徒步'];
  const travelLabels = [];
  for (let i = 1; i < LOCATIONS.length; i++) {
    const prev = LOCATIONS[i-1];
    const cur = LOCATIONS[i];
    const mx = (prev.x + cur.x) / 2 + ((i % 2 === 0) ? -8 : 14);
    const my = (prev.y + cur.y) / 2 + 6;
    travelLabels.push({ x: mx, y: my, text: travelModes[i-1] || '路', show: reachedIndex >= i });
  }
  let travelHTML = '';
  travelLabels.forEach(t => {
    if (t.show) {
      travelHTML += `<text x="${t.x}" y="${t.y}" fill="#8B7E6E" font-size="9" font-style="italic" text-anchor="middle">${t.text}</text>`;
    }
  });

  // Distortion based on nerve
  const nerveRatio = state.nerve / 10;
  const distortIntensity = nerveRatio < 0.5 ? (0.5 - nerveRatio) * 3 : 0;

  const svg = `
    <svg class="map-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="agedPaper">
          <feTurbulence baseFrequency="0.85" numOctaves="2" seed="7"/>
          <feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.22 0 0 0 0.06 0"/>
        </filter>
        <filter id="mapDistort">
          <feTurbulence baseFrequency="0.02" numOctaves="2" seed="3"/>
          <feDisplacementMap in="SourceGraphic" scale="${distortIntensity}"/>
        </filter>
      </defs>

      <!-- Background -->
      <rect width="${W}" height="${H}" fill="#FAF7F2"/>
      <rect width="${W}" height="${H}" filter="url(#agedPaper)" opacity="0.5"/>

      <g filter="${distortIntensity > 0 ? 'url(#mapDistort)' : ''}">
        <!-- Decorative coastline (top-left, suggesting 鎌倉湾) -->
        <path d="M 10 105 Q 30 95 50 110 Q 70 125 40 145 Q 20 155 8 140"
              stroke="#B5AA98" stroke-width="0.5" fill="none" opacity="0.5"/>
        <text x="14" y="100" fill="#B5AA98" font-size="8" font-style="italic">鎌倉湾</text>

        <!-- Tokyo area boundary (lower-right) -->
        <path d="M 150 250 Q 145 260 160 290 Q 180 320 200 330 Q 240 345 290 340 Q 305 335 308 310 Q 305 280 290 260 Q 270 248 220 245 Q 180 245 150 250 Z"
              stroke="#B5AA98" stroke-width="0.5" fill="rgba(201,168,106,0.03)"
              stroke-dasharray="3,3" opacity="0.6"/>
        <text x="294" y="262" fill="#8B7E6E" font-size="10" font-style="italic" text-anchor="end" letter-spacing="0.1em">東京</text>

        <!-- Journey path -->
        <path d="${path}"
              stroke="#8B7E6E" stroke-width="1.2" fill="none"
              stroke-dasharray="3,4" opacity="0.7"/>

        <!-- Travel mode labels -->
        ${travelHTML}

        <!-- Locations -->
        ${locsHTML}
      </g>

      <!-- Compass rose (top-right, outside distort) -->
      <g transform="translate(285, 38)" opacity="0.7">
        <circle r="11" fill="none" stroke="#8B7E6E" stroke-width="0.5"/>
        <path d="M 0 -7 L 1.5 0 L 0 7 L -1.5 0 Z" fill="#C9A86A" opacity="0.7"/>
        <text x="0" y="-13" text-anchor="middle" fill="#8B7E6E" font-size="7" font-family="serif">北</text>
      </g>

      <!-- Scale -->
      <g transform="translate(20, 400)" opacity="0.6">
        <line x1="0" y1="0" x2="36" y2="0" stroke="#8B7E6E" stroke-width="0.5"/>
        <line x1="0" y1="-2" x2="0" y2="2" stroke="#8B7E6E" stroke-width="0.5"/>
        <line x1="36" y1="-2" x2="36" y2="2" stroke="#8B7E6E" stroke-width="0.5"/>
        <text x="0" y="11" fill="#8B7E6E" font-size="7" font-family="serif">およそ五十町</text>
      </g>
    </svg>
  `;

  $('#map-svg-container').innerHTML = svg;
}

function openMap() {
  renderMap();
  $('#map-overlay').classList.add('open');
}

function closeMap() {
  $('#map-overlay').classList.remove('open');
}

$('#map-overlay').addEventListener('click', (e) => {
  if (e.target === $('#map-overlay')) closeMap();
});

function showImpact(text, type = 'loss') {
  const div = document.createElement('div');
  div.className = `impact ${type}`;
  div.innerHTML = text;
  const target = currentSceneEl || $('#content');
  target.appendChild(div);
  scrollToBottom();
}

async function loseNerve(amount, reason) {
  const before = state.nerve;
  state.nerve = Math.max(0, state.nerve - amount);
  updateDistortion();
  updateStatus();
  dispatchHgrState();
  dispatchHgrImpact({ type: 'loss', label: '神經', amount, reason });
  showImpact(
    `<span class="impact-label">神經</span>　${before} → ${state.nerve}　<strong>−${amount}</strong>` +
    (reason ? `<br><span class="impact-label">原因</span>　${reason}` : ''),
    'loss'
  );
  await sleep(600);
}

function gainStat(stat, amount, reason) {
  state[stat] += amount;
  updateStatus();
  dispatchHgrState();
  dispatchHgrImpact({ type: 'gain', label: stat === 'insight' ? '洞察' : '執筆', amount, reason });
  showImpact(
    `<span class="impact-label">${stat === 'insight' ? '洞察' : '執筆'}</span>　+${amount}` +
    (reason ? `　${reason}` : ''),
    'gain'
  );
}

// ══════════════════ FORCED BUTTON ══════════════════
function makeGearSVG(size, speed, opacity) {
  return `<svg class="gear-spin" width="${size}" height="${size}" viewBox="0 0 100 88"
    style="color:#B5AA98; opacity:${opacity}; animation: gearRotate ${speed}s linear infinite;">
    <use href="#gear-icon"/>
  </svg>`;
}

function renderForcedBtn(text, onclick) {
  const n = state.nerve;
  const erodedClass = n <= 2 ? 'eroded-deep' : n <= 4 ? 'eroded' : '';
  const btnText = n <= 2 ? corrupt(text) : text;

  let gearsHTML = '';
  if (n <= 3) {
    const count = n <= 1 ? 3 : n <= 2 ? 2 : 1;
    const speed = n <= 1 ? 8 : n <= 2 ? 20 : 60;
    const opacity = n <= 1 ? 0.18 : n <= 2 ? 0.10 : 0.04;
    const size = n <= 1 ? 120 : n <= 2 ? 80 : 50;
    for (let i = 0; i < count; i++) {
      const offsetX = (i - 1) * (size * 0.6);
      const offsetY = i % 2 === 0 ? 0 : size * 0.3;
      gearsHTML += `<div style="position:absolute;left:calc(50% + ${offsetX}px);top:calc(50% + ${offsetY}px);">
        ${makeGearSVG(size, speed + i * 3, opacity)}
      </div>`;
    }
  }

  return `<div class="forced-wrapper">
    ${gearsHTML ? `<div class="gear-pattern">${gearsHTML}</div>` : ''}
    <button class="forced-btn ${erodedClass}" onclick="${onclick}">${btnText}</button>
  </div>`;
}

function showForcedStep(container, steps, index) {
  return new Promise(resolve => {
    const div = document.createElement('div');
    div.style.marginBottom = '4px';
    div.innerHTML = renderForcedBtn(steps[index], `completeStep(this, ${index})`);
    container.appendChild(div);
    scrollToBottom();
    div.querySelector('.forced-btn')._resolve = resolve;
  });
}

function completeStep(btn) {
  const text = btn.textContent;
  const wrapper = btn.closest('.forced-wrapper');
  const container = wrapper.parentElement;
  container.innerHTML = `<div style="color:#8B7E6E; font-size:13px; font-style:italic; margin-bottom:4px;">✓ ${text}</div>`;
  if (btn._resolve) btn._resolve();
}

// ══════════════════ SCENE RUNNER ══════════════════

async function applyEffects(eff) {
  if (!eff) return;
  if (eff.nerveLoss) {
    await loseNerve(eff.nerveLoss.amount, eff.nerveLoss.reason || '');
  }
  if (eff.insightGain) {
    gainStat('insight', eff.insightGain.amount, eff.insightGain.reason || '');
  }
  if (eff.writingGain) {
    gainStat('writing', eff.writingGain.amount, eff.writingGain.reason || '');
  }
}

async function renderBlock(block, isLastBeforeContinuation) {
  switch (block.type) {
    case 'break': {
      const div = document.createElement('div');
      div.style.height = '20px';
      currentSceneEl.appendChild(div);
      return;
    }
    case 'pause': {
      await sleep(block.duration || 1000);
      return;
    }
    case 'system': {
      const div = appendBlock('system-msg');
      div.textContent = block.content;
      addToHistory(block.content, 'system-msg', 'system');
      await sleep(450);
      return;
    }
    case 'dialogue': {
      if (block.speaker) appendSpeaker(block.speaker);
      const div = appendBlock('dialogue');
      const text = block.jp ? `${block.jp}\n${block.cn}` : (block.cn || '');
      addToHistory(block.cn || block.jp || '', 'dialogue');
      if (isLastBeforeContinuation) await typeText(div, text, 20);
      else await typeAndWait(div, text, 20);
      return;
    }
    case 'inner':
    case 'narration':
    default: {
      const cls = block.type === 'inner' ? 'inner' : 'narration';
      const speed = block.type === 'inner' ? 25 : 18;
      const div = appendBlock(cls);
      const content = state.nerve <= 5 ? corrupt(block.content) : block.content;
      addToHistory(block.content, cls);
      if (isLastBeforeContinuation) await typeText(div, content, speed);
      else await typeAndWait(div, content, speed);
      return;
    }
  }
}

async function handleChoice(choice) {
  // Disable all choice buttons in the active scene to prevent double-clicks
  if (currentSceneEl) {
    currentSceneEl.querySelectorAll('.choice-btn').forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = '0.4';
      btn.style.cursor = 'default';
      btn.onclick = null;
    });
  }
  addToHistory(choice.text, 'choice-made', 'choice');
  if (choice.flag) state.choicesMade[choice.flag] = true;
  if (choice.notebook) {
    addNotebook(choice.notebook.key, choice.notebook.symbol, choice.notebook.desc);
  }
  if (choice.unlock) {
    if (Array.isArray(choice.unlock)) choice.unlock.forEach(unlockSymbol);
    else unlockSymbol(choice.unlock);
  }
  await applyEffects(choice);
  if (choice.next) await playScene(choice.next);
}

async function playScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) {
    console.warn('Scene not found:', sceneId);
    return;
  }
  state.scene = sceneId;
  saveGame(); // 自動存檔（每場景進入時）

  // Fold previous scene if specified
  if (scene.fold) {
    await foldCurrentScene(scene.fold);
    newScene();
  }

  // Audio (ambient / sfx)
  if (scene.audio) {
    if (scene.audio.ambient) playAmbient(scene.audio.ambient);
    if (scene.audio.sfx) {
      const sfxList = Array.isArray(scene.audio.sfx) ? scene.audio.sfx : [scene.audio.sfx];
      sfxList.forEach(u => playSfx(u));
    }
  }

  // Visit location
  if (scene.visit) visitLocation(scene.visit);

  // Get text blocks (array or function of state)
  const text = typeof scene.text === 'function' ? scene.text(state) : (scene.text || []);

  // Render each block
  for (let i = 0; i < text.length; i++) {
    const block = text[i];
    const isLast = i === text.length - 1;
    const hasContinuation = !!(scene.choices || scene.next || scene.showEnd);
    const isLastBeforeContinuation = isLast && hasContinuation && (
      block.type === 'narration' || block.type === 'inner' || block.type === 'dialogue'
    ) ? false : (isLast && hasContinuation);
    await renderBlock(block, isLastBeforeContinuation);
  }

  // Notebook (after text rendering)
  if (scene.notebook) {
    addNotebook(scene.notebook.key, scene.notebook.symbol, scene.notebook.desc);
  }
  if (scene.unlock) {
    if (Array.isArray(scene.unlock)) scene.unlock.forEach(unlockSymbol);
    else unlockSymbol(scene.unlock);
  }
  // Static effects
  await applyEffects(scene);
  // Dynamic effects
  if (scene.effectFn) {
    await applyEffects(scene.effectFn(state));
  }

  // Continue
  if (scene.choices) {
    await sleep(120);
    showChoices(scene.choices.map(c => ({
      text: c.text,
      handler: () => handleChoice(c)
    })));
  } else if (scene.next) {
    await sleep(180);
    await playScene(scene.next);
  } else if (scene.showEnd) {
    await sleep(400);
    await waitForClick();
    showEndOverlay();
  }
}

// ══════════════════ SAVE SYSTEM (三層備援) ══════════════════
// Layer 1: localStorage   (跨 session 持久)
// Layer 2: sessionStorage (重整不丟，關閉 tab 後丟失)
// Layer 3: 記憶體變數      (最後一道保險，本次 session 內保命)

const SAVE_KEY = 'haguruma_save_v1';
let _memorySave = null;

function buildSaveData() {
  return {
    v: 1,
    scene: state.scene,
    nerve: state.nerve,
    insight: state.insight,
    writing: state.writing,
    notebook: state.notebook,
    choicesMade: state.choicesMade,
    journey: state.journey,
    connections: state.connections,
    currentChapter: state.currentChapter,
    savedAt: Date.now(),
  };
}

function saveGame() {
  if (state.scene === 'title' || !state.scene) return;
  const data = JSON.stringify(buildSaveData());
  _memorySave = data;
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
  try { sessionStorage.setItem(SAVE_KEY, data); } catch (e) {}
}

function loadSaveRaw() {
  let data = null;
  try { data = localStorage.getItem(SAVE_KEY); } catch (e) {}
  if (!data) { try { data = sessionStorage.getItem(SAVE_KEY); } catch (e) {} }
  if (!data) data = _memorySave;
  if (!data) return null;
  try { return JSON.parse(data); } catch (e) { return null; }
}

function hasSave() {
  const s = loadSaveRaw();
  return s && s.scene && s.scene !== 'title';
}

function clearSave() {
  _memorySave = null;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  try { sessionStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function restoreState(saved) {
  state.scene          = saved.scene;
  state.nerve          = saved.nerve;
  state.insight        = saved.insight;
  state.writing        = saved.writing;
  state.notebook       = saved.notebook       || [];
  state.choicesMade    = saved.choicesMade    || {};
  state.journey        = saved.journey        || { current: 'kasugai', visited: [], symbols: {} };
  state.connections    = saved.connections    || [];
  state.currentChapter = saved.currentChapter || 1;
  state.history        = []; // history 不存盤——讀檔即重啟，不重播
}

async function resumeGame() {
  const saved = loadSaveRaw();
  if (!saved) { startGame(); return; }
  restoreState(saved);
  $('#game').innerHTML = `
    <div id="status"></div>
    <div id="content"></div>
  `;
  // 顯示「已讀章節」摺疊條，提示玩家從何處續
  const recap = document.createElement('div');
  recap.className = 'fold-summary expanded';
  recap.style.opacity = '0.55';
  recap.innerHTML = `<span>── 續・第 ${CH_NUM_KANJI[state.currentChapter - 1]} 章（前情已讀過） ──</span><span class="fold-arrow">∨</span>`;
  $('#content').appendChild(recap);

  updateStatus();
  updateDistortion();
  refreshSidePanels();
  dispatchHgrState();
  newScene();
  await playScene(state.scene);
}

    notebook: { key: 'raincoat_death', symbol: 'raincoat', desc: '姊夫轢死——穿著與季節不符的雨衣' },
    unlock: 'raincoat_death',
    nerveLoss: { amount: 2, reason: '死亡與雨衣的連結' },
    next: 'auto_ending',
  },

  auto_ending: {
    text: [
      { type: 'break' },
      { type: 'narration', content: '你仍然在這間旅館的房間裡，繼續寫著之前那篇短篇。深夜的走廊沒有人經過。' },
      { type: 'narration', content: '但偶爾——門外會傳來翅膀的聲音。也許什麼地方養了鳥。' },
      { type: 'break' },
      { type: 'system', content: '第一章「レエン・コオト」 終' },
    ],
    notebook: { key: 'wing_corridor', symbol: 'wing', desc: '旅館深夜——門外傳來翅膀的聲音' },
    unlock: 'wing_corridor',
    insightGain: { amount: 1, reason: '夜半之聲' },
    showEnd: true,
  },
};

// ══════════════════ INIT ══════════════════
renderTitle();
</script>

<!-- ══════════════════ REACT WIDGETS ══════════════════
     四個元件源自 src/components/ — 此處 inline 是為了單檔原型可直接 npx serve。
     正式 build 時應從 src/components/ 匯入。
     State 同步：監聽 'hgr-state' / 'hgr-impact' CustomEvent。
-->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ── Particles (浮動粒子) ──
function Particles({ nerve = 10, count = 15 }) {
  const ratio = nerve / 10;
  const baseColor = ratio > 0.5
    ? `rgba(200, 196, 184, ${0.08 + (1 - ratio) * 0.12})`
    : `rgba(139, 64, 64, ${0.10 + (1 - ratio) * 0.18})`;
  const particles = useMemo(() =>
    Array.from({ length: count }, (_, i) => ({
      id: i,
      left: Math.random() * 100,
      delay: Math.random() * 8,
      dur: 6 + Math.random() * 6,
      size: 1 + Math.random() * 2,
    })), [count]);
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1, overflow: 'hidden' }}>
      {particles.map(p => (
        <div key={p.id} style={{
          position: 'absolute', left: `${p.left}%`, bottom: '-5%',
          width: p.size, height: p.size, borderRadius: '50%', background: baseColor,
          animation: `hgr-float-up ${p.dur}s ${p.delay}s infinite linear`,
        }} />
      ))}
      <style>{`
        @keyframes hgr-float-up {
          0%   { transform: translateY(0);     opacity: 0;    }
          10%  { opacity: 0.3; }
          90%  { opacity: 0.05; }
          100% { transform: translateY(-105vh); opacity: 0;   }
        }
      `}</style>
    </div>
  );
}

// ── NerveBar (神經衰減條) ──
function NerveBar({ nerve = 10, max = 10 }) {
  const ratio = nerve / max;
  const pct = Math.max(0, Math.min(100, ratio * 100));
  const isDanger = ratio <= 0.4;
  const isCritical = ratio <= 0.2;
  const barColor = isCritical
    ? 'linear-gradient(90deg, #8E3B2A, #a04840)'
    : isDanger
      ? 'linear-gradient(90deg, #8E3B2A, #a05545)'
      : 'linear-gradient(90deg, #C9A86A, #B5AA98)';
  const labelColor = isDanger ? '#8E3B2A' : '#8B7E6E';
  const valueColor = isDanger ? '#8E3B2A' : '#2C2418';
  return (
    <div style={{ width: '100%', minWidth: 140 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, letterSpacing: '0.08em', marginBottom: 3 }}>
        <span style={{ color: labelColor }}>神經</span>
        <span style={{ color: valueColor }}>{nerve} / {max}</span>
      </div>
      <div style={{
        height: 5, background: '#DDD6C6', borderRadius: 3, overflow: 'hidden',
        border: `1px solid ${isDanger ? 'rgba(142,59,42,0.3)' : '#C8BFA8'}`,
      }}>
        <div style={{
          width: `${pct}%`, height: '100%', background: barColor, borderRadius: 3,
          transition: 'width 0.8s ease, background 0.6s ease',
          ...(isCritical ? { animation: 'hgr-nerve-pulse 2s infinite' } : {}),
        }} />
      </div>
      <style>{`@keyframes hgr-nerve-pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }`}</style>
    </div>
  );
}

// ── ImpactToast (浮動增減通知) ──
function ImpactToast({ impact, duration = 2200 }) {
  const [visible, setVisible] = useState(false);
  const [current, setCurrent] = useState(null);
  useEffect(() => {
    if (!impact) return;
    setCurrent(impact);
    setVisible(true);
    const timer = setTimeout(() => setVisible(false), duration);
    return () => clearTimeout(timer);
  }, [impact, duration]);
  if (!current) return null;
  const isLoss = current.type === 'loss';
  const bg = isLoss ? 'rgba(142, 59, 42, 0.92)' : 'rgba(91, 122, 94, 0.92)';
  const border = isLoss ? '#8E3B2A' : '#5B7A5E';
  const textColor = isLoss ? '#FAF7F2' : '#FAF7F2';
  const sign = isLoss ? '−' : '+';
  return (
    <div style={{
      position: 'fixed', top: 28, left: '50%',
      transform: `translateX(-50%) translateY(${visible ? 0 : -50}px)`,
      background: bg, border: `1px solid ${border}`, borderRadius: 6,
      padding: '10px 22px', color: textColor, fontSize: 13,
      fontFamily: "'Noto Serif TC', serif", letterSpacing: '0.04em',
      zIndex: 200, transition: 'transform 0.4s ease, opacity 0.4s ease',
      opacity: visible ? 1 : 0, pointerEvents: 'none',
      boxShadow: '0 4px 20px rgba(0, 0, 0, 0.5)',
      display: 'flex', alignItems: 'center', gap: 10,
    }}>
      <span style={{ fontWeight: 500 }}>{current.label}</span>
      <span style={{ fontSize: 15, fontWeight: 600 }}>{sign}{current.amount}</span>
      {current.reason && (
        <span style={{ fontSize: 11, opacity: 0.7, marginLeft: 4 }}>— {current.reason}</span>
      )}
    </div>
  );
}

// ── 連線到全域 state ──
function useHgrState() {
  const [s, setS] = useState({ nerve: 10, insight: 0, writing: 0 });
  useEffect(() => {
    const h = e => setS(e.detail);
    window.addEventListener('hgr-state', h);
    return () => window.removeEventListener('hgr-state', h);
  }, []);
  return s;
}
function useHgrImpact() {
  const [imp, setImp] = useState(null);
  useEffect(() => {
    const h = e => setImp({ ...e.detail, _id: Date.now() + Math.random() });
    window.addEventListener('hgr-impact', h);
    return () => window.removeEventListener('hgr-impact', h);
  }, []);
  return imp;
}

function ConnectedParticles()  { const s = useHgrState(); return <Particles nerve={s.nerve} />; }
function ConnectedNerveBar()   { const s = useHgrState(); return <NerveBar nerve={s.nerve} />; }
function ConnectedImpactToast(){ const i = useHgrImpact(); return <ImpactToast impact={i} />; }

// ── Mount: particles / impact toast 立即掛；nerve bar / stat radar 等容器存在後再掛 ──
ReactDOM.createRoot(document.getElementById('particles-root')).render(<ConnectedParticles />);
ReactDOM.createRoot(document.getElementById('impact-toast-root')).render(<ConnectedImpactToast />);

// NerveBar 在 #status 內，#status 由 updateStatus() 動態建立；
// 用 MutationObserver 偵測掛載點出現後一次性 mount。
let _nerveBarMounted = false;
const _nerveBarObserver = new MutationObserver(() => {
  if (_nerveBarMounted) return;
  const el = document.getElementById('status-nerve-bar-root');
  if (el) {
    ReactDOM.createRoot(el).render(<ConnectedNerveBar />);
    _nerveBarMounted = true;
    _nerveBarObserver.disconnect();
  }
});
_nerveBarObserver.observe(document.body, { childList: true, subtree: true });

// 初始狀態廣播一次（讓 React widgets 拿到初值）
window.dispatchEvent(new CustomEvent('hgr-state', {
  detail: { nerve: state.nerve, insight: state.insight, writing: state.writing }
}));
</script>
</body>
