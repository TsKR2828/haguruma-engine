<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歯車 — 原型</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif TC', 'Noto Serif JP', Georgia, serif;
    background: #0a0a0c;
    color: #c8c4b8;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #distortion {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 100;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(20,5,5,0.5) 100%);
    opacity: 0; transition: opacity 1.5s;
  }

  #noise {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 99; opacity: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.4'/></svg>");
    transition: opacity 1s;
  }

  #game {
    max-width: 640px; margin: 0 auto; padding: 20px;
    min-height: 100vh; position: relative;
  }

  /* ── Status bar ── */
  #status {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,12,0.95); backdrop-filter: blur(4px);
    border-bottom: 1px solid #1e1e24;
    padding: 10px 0; margin-bottom: 24px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: #6b6860; letter-spacing: 0.08em;
  }
  .stat-group { display: flex; gap: 16px; }
  .stat-val { color: #c8c4b8; }
  .stat-val.danger { color: #8b4040; }
  #notebook-btn {
    background: none; border: 1px solid #1e1e24; color: #6b6860;
    padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
    letter-spacing: 0.08em;
  }
  #notebook-btn:hover { border-color: #8b7355; }

  /* ── Text ── */
  .narration { color: #c8c4b8; line-height: 1.9; font-size: 15px; margin-bottom: 12px; letter-spacing: 0.03em; }
  .inner { color: #7070a0; line-height: 1.9; font-size: 15px; font-style: italic; margin-bottom: 12px; }
  .dialogue { color: #a08060; line-height: 1.9; font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; }
  .speaker { color: #6b6860; font-size: 12px; display: block; margin-bottom: 2px; letter-spacing: 0.08em; }
  .system-msg { color: #7aaa8a; font-size: 13px; padding: 6px 12px; border-left: 2px solid #4a6858; margin: 8px 0; }
  .history-text { opacity: 0.4; }
  .history-text.system-msg { opacity: 0.7; }
  .choice-made { color: #5a4a38; font-size: 13px; font-style: italic; margin-bottom: 10px; }

  .typing-cursor::after {
    content: '▍'; opacity: 0.5; animation: blink 1s infinite;
  }
  @keyframes blink { 0%,50%{opacity:0.5} 51%,100%{opacity:0} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  /* ── Choices ── */
  .choices { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.5s; }
  .choices-label { color: #6b6860; font-size: 11px; letter-spacing: 0.15em; margin-bottom: 4px; }
  .choice-btn {
    background: #1a1a20; border: 1px solid #2a2a35; color: #e8e4d8;
    padding: 12px 16px; font-size: 14px; line-height: 1.6; text-align: left;
    cursor: pointer; font-family: inherit; transition: all 0.2s; letter-spacing: 0.02em;
  }
  .choice-btn:hover { background: #222230; border-color: #8b7355; }

  /* ── Action (micro-interaction) ── */
  .action-btn {
    display: inline-block; background: none; border: 1px solid #4a6858;
    color: #7aaa8a; padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; margin: 8px 0; transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .action-btn:hover { background: rgba(74,104,88,0.15); border-color: #7aaa8a; }

  /* ── Forced steps ── */
  .forced-wrapper { position: relative; display: inline-block; margin: 6px 0; }

  .forced-btn {
    background: #12121a; border: 1px solid #2a2a35; color: #c8c4b8;
    padding: 10px 20px; font-size: 14px; cursor: pointer; font-family: inherit;
    position: relative; z-index: 2; transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .forced-btn:hover { background: #1a1a24; border-color: #6b6860; }
  .forced-btn.eroded { clip-path: polygon(0% 5%,2% 0%,5% 6%,8% 0%,11% 5%,14% 0%,17% 4%,20% 0%,23% 5%,26% 0%,29% 6%,32% 0%,35% 5%,38% 0%,41% 4%,44% 0%,47% 5%,50% 0%,53% 6%,56% 0%,59% 5%,62% 0%,65% 4%,68% 0%,71% 5%,74% 0%,77% 6%,80% 0%,83% 5%,86% 0%,89% 4%,92% 0%,95% 5%,98% 0%,100% 5%,100% 95%,98% 100%,95% 94%,92% 100%,89% 96%,86% 100%,83% 95%,80% 100%,77% 94%,74% 100%,71% 95%,68% 100%,65% 96%,62% 100%,59% 95%,56% 100%,53% 94%,50% 100%,47% 95%,44% 100%,41% 96%,38% 100%,35% 95%,32% 100%,29% 94%,26% 100%,23% 95%,20% 100%,17% 96%,14% 100%,11% 95%,8% 100%,5% 94%,2% 100%,0% 95%); }
  .forced-btn.eroded-deep { clip-path: polygon(0% 8%,3% 0%,7% 10%,11% 0%,15% 8%,19% 0%,23% 10%,27% 0%,31% 8%,35% 0%,39% 10%,43% 0%,47% 8%,50% 0%,53% 8%,57% 0%,61% 10%,65% 0%,69% 8%,73% 0%,77% 10%,81% 0%,85% 8%,89% 0%,93% 10%,97% 0%,100% 8%,100% 92%,97% 100%,93% 90%,89% 100%,85% 92%,81% 100%,77% 90%,73% 100%,69% 92%,65% 100%,61% 90%,57% 100%,53% 92%,50% 100%,47% 92%,43% 100%,39% 90%,35% 100%,31% 92%,27% 100%,23% 90%,19% 100%,15% 92%,11% 100%,7% 90%,3% 100%,0% 92%); }

  /* Gear pattern overlay */
  .gear-pattern {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 1; pointer-events: none; overflow: hidden; border-radius: 2px;
  }
  .gear-spin {
    position: absolute; top: 50%; left: 50%; transform-origin: center;
    opacity: 0; pointer-events: none;
  }
  @keyframes gearRotate { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }

  /* ── Impact ── */
  .impact { padding: 10px 14px; margin: 10px 0; font-size: 13px; animation: fadeIn 0.4s; }
  .impact.loss { background: rgba(40,10,10,0.4); border-left: 3px solid #8b4040; color: #d4a89a; }
  .impact.gain { background: rgba(20,30,20,0.4); border-left: 3px solid #6b8a4a; color: #b8c89a; }
  .impact-label { color: #6b6860; font-size: 12px; letter-spacing: 0.08em; }

  /* ── Notebook overlay ── */
  #notebook-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(5,5,8,0.92); z-index: 200;
    display: none; justify-content: center; align-items: center;
    animation: fadeIn 0.3s;
  }
  #notebook-overlay.open { display: flex; }
  #notebook-panel {
    background: #111114; border: 1px solid #1e1e24; padding: 28px;
    max-width: 460px; width: 90%; max-height: 70vh; overflow-y: auto;
  }
  .nb-title { color: #8b7355; font-size: 14px; letter-spacing: 0.2em; margin-bottom: 16px; border-bottom: 1px solid #1e1e24; padding-bottom: 10px; }
  .nb-group-label { color: #6b6860; font-size: 12px; margin-bottom: 6px; letter-spacing: 0.1em; }
  .nb-entry { color: #c8c4b8; font-size: 13px; line-height: 1.6; padding-left: 14px; border-left: 1px solid #5a4a38; margin-bottom: 4px; }
  .nb-close { background: none; border: 1px solid #1e1e24; color: #6b6860; padding: 5px 14px; font-size: 12px; cursor: pointer; margin-top: 14px; font-family: inherit; }

  /* ── Title ── */
  .title-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:90vh; cursor:pointer; }
  .title-sub { color:#6b6860; font-size:12px; letter-spacing:0.3em; animation: fadeIn 1s; }
  .title-main { color:#e8e4d8; font-size:44px; font-weight:300; letter-spacing:0.3em; font-family:'Noto Serif JP',serif; animation: fadeIn 1.5s; margin: 16px 0 6px; }
  .title-cn { color:#6b6860; font-size:14px; letter-spacing:0.15em; animation: fadeIn 2s; margin-bottom: 50px; }
  .title-start { color:#8b7355; font-size:12px; letter-spacing:0.2em; animation: pulse 3s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

  /* ── End screen ── */
  .end-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0a0a0c; z-index: 50; animation: fadeIn 2s;
  }
  .end-label { color: #c8c4b8; font-size: 18px; letter-spacing: 0.3em; margin-bottom: 24px; }
  .end-stats { color: #6b6860; font-size: 13px; line-height: 2.2; margin-bottom: 32px; }
</style>
</head>
<body>
<div id="distortion"></div>
<div id="noise"></div>
<div id="game"></div>

<div id="notebook-overlay" onclick="this.classList.remove('open')">
  <div id="notebook-panel" onclick="event.stopPropagation()">
    <div class="nb-title">手帖</div>
    <div id="nb-content"></div>
    <button class="nb-close" onclick="document.getElementById('notebook-overlay').classList.remove('open')">關閉</button>
  </div>
</div>

<!-- Gear SVG definition -->
<svg style="position:absolute;width:0;height:0">
  <defs>
    <g id="gear-icon">
      <path d="M50 15 L53 28 L60 18 L58 32 L68 24 L62 36 L74 32 L64 42 L76 42 L64 48 L74 56 L62 52 L68 64 L58 56 L60 70 L53 60 L50 73 L47 60 L40 70 L42 56 L32 64 L38 52 L26 56 L36 48 L24 42 L36 42 L26 32 L38 36 L32 24 L42 32 L40 18 L47 28 Z" fill="currentColor"/>
      <circle cx="50" cy="44" r="10" fill="#0a0a0c"/>
    </g>
  </defs>
</svg>

<script>
// ═══��══════════════ STATE ══════════════════
const state = {
  scene: 'title',
  nerve: 10,
  insight: 0,
  writing: 0,
  notebook: [],
  history: [],
  choicesMade: {},
};

const SYMBOLS = {
  raincoat: { icon: '🧥', system: 'レエン・コオト' },
  gear:     { icon: '⚙️', system: '歯車' },
  wing:     { icon: '🪽', system: '翼' },
  book:     { icon: '📖', system: '本' },
};

// ══════════════════ UTILS ══════════════════
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function corrupt(text) {
  const ratio = state.nerve / 10;
  if (ratio > 0.5) return text;
  const chars = '̷̧̢̡̕͝͞҉̴̶̸͍̩̭̮̯̪̟̱̬̜̦̤̳';
  const intensity = (0.5 - ratio) * 2;
  return text.split('').map(c => {
    if (Math.random() < intensity * 0.15 && c.trim())
      return c + chars[Math.floor(Math.random() * chars.length)];
    return c;
  }).join('');
}

function updateDistortion() {
  const r = state.nerve / 10;
  $('#distortion').style.opacity = r < 0.8 ? (0.8 - r) * 1.5 : 0;
  $('#noise').style.opacity = r < 0.4 ? (0.4 - r) * 0.6 : 0;
}

async function typeText(el, text, speed = 18) {
  el.textContent = '';
  el.classList.add('typing-cursor');
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    await sleep(speed);
  }
  el.classList.remove('typing-cursor');
}

function updateStatus() {
  const nerveClass = state.nerve <= 3 ? 'danger' : '';
  $('#status').innerHTML = `
    <div class="stat-group">
      <span>神經 <span class="stat-val ${nerveClass}">${state.nerve}/10</span></span>
      <span>洞察 <span class="stat-val">${state.insight}</span></span>
      <span>執筆 <span class="stat-val">${state.writing}</span></span>
    </div>
    <button id="notebook-btn" onclick="openNotebook()">手帖 (${state.notebook.length})</button>
  `;
}

function addNotebook(key, symbol, desc) {
  if (state.notebook.find(n => n.key === key)) return;
  state.notebook.push({ key, symbol, desc });
}

function openNotebook() {
  const grouped = {};
  state.notebook.forEach(e => {
    if (!grouped[e.symbol]) grouped[e.symbol] = [];
    grouped[e.symbol].push(e);
  });
  let html = '';
  for (const [sym, items] of Object.entries(grouped)) {
    const s = SYMBOLS[sym];
    html += `<div class="nb-group-label">${s?.icon || ''} ${s?.system || sym}</div>`;
    items.forEach(it => { html += `<div class="nb-entry">${it.desc}</div>`; });
    html += '<div style="height:12px"></div>';
  }
  if (state.notebook.length === 0) html = '<div style="color:#6b6860;font-size:13px">尚無記錄。</div>';
  $('#nb-content').innerHTML = html;
  $('#notebook-overlay').classList.add('open');
}

// ══════════════════ IMPACT ══════════════════
function showImpact(text, type = 'loss') {
  const div = document.createElement('div');
  div.className = `impact ${type}`;
  div.innerHTML = text;
  $('#content').appendChild(div);
}

async function loseNerve(amount, reason) {
  const before = state.nerve;
  state.nerve = Math.max(0, state.nerve - amount);
  updateDistortion();
  updateStatus();
  showImpact(
    `<span class="impact-label">神經</span>　${before} → ${state.nerve}　<strong>−${amount}</strong>` +
    (reason ? `<br><span class="impact-label">原因</span>　${reason}` : ''),
    'loss'
  );
  await sleep(600);
}

function gainStat(stat, amount, reason) {
  state[stat] += amount;
  updateStatus();
  showImpact(
    `<span class="impact-label">${stat === 'insight' ? '洞察' : '執筆'}</span>　+${amount}` +
    (reason ? `　${reason}` : ''),
    'gain'
  );
}

// ══════════════════ FORCED BUTTON ══════════════════
function makeGearSVG(size, speed, opacity) {
  return `<svg class="gear-spin" width="${size}" height="${size}" viewBox="0 0 100 88"
    style="color:#c8c4b8; opacity:${opacity}; animation: gearRotate ${speed}s linear infinite;">
    <use href="#gear-icon"/>
  </svg>`;
}

function renderForcedBtn(text, onclick) {
  const n = state.nerve;
  const erodedClass = n <= 2 ? 'eroded-deep' : n <= 4 ? 'eroded' : '';
  const btnText = n <= 2 ? corrupt(text) : text;

  let gearsHTML = '';
  if (n <= 3) {
    const count = n <= 1 ? 3 : n <= 2 ? 2 : 1;
    const speed = n <= 1 ? 8 : n <= 2 ? 20 : 60;
    const opacity = n <= 1 ? 0.18 : n <= 2 ? 0.10 : 0.04;
    const size = n <= 1 ? 120 : n <= 2 ? 80 : 50;
    for (let i = 0; i < count; i++) {
      const offsetX = (i - 1) * (size * 0.6);
      const offsetY = i % 2 === 0 ? 0 : size * 0.3;
      gearsHTML += `<div style="position:absolute;left:calc(50% + ${offsetX}px);top:calc(50% + ${offsetY}px);">
        ${makeGearSVG(size, speed + i * 3, opacity)}
      </div>`;
    }
  }

  return `<div class="forced-wrapper">
    ${gearsHTML ? `<div class="gear-pattern">${gearsHTML}</div>` : ''}
    <button class="forced-btn ${erodedClass}" onclick="${onclick}">${btnText}</button>
  </div>`;
}

// ══════════════════ RENDERING ══════════════════
function renderHistory() {
  return state.history.map(h => {
    if (h.type === 'choice') return `<div class="choice-made">▸ ${h.text}</div>`;
    if (h.type === 'system') return `<div class="system-msg history-text">${h.text}</div>`;
    const cls = h.cls || 'narration';
    return `<div class="${cls} history-text">${h.text}</div>`;
  }).join('');
}

function addToHistory(text, cls = 'narration', type = 'text') {
  state.history.push({ text, cls, type });
}

// ══════════════════ SCENES ══════════════════

function renderTitle() {
  $('#game').innerHTML = `
    <div class="title-screen" onclick="startGame()">
      <div class="title-sub">芥川龍之介 遺稿</div>
      <div class="title-main">歯車</div>
      <div class="title-cn">齒輪</div>
      <div class="title-start">點擊任意處開始</div>
    </div>
  `;
}

async function startGame() {
  state.scene = 'prologue';
  $('#game').innerHTML = `
    <div id="status"></div>
    <div id="content"></div>
  `;
  updateStatus();
  await renderPrologue();
}

async function renderPrologue() {
  const c = $('#content');
  c.innerHTML = renderHistory();

  const sys1 = document.createElement('div');
  sys1.className = 'system-msg';
  sys1.textContent = '第一章　レエン・コオト';
  c.appendChild(sys1);

  const sys2 = document.createElement('div');
  sys2.className = 'system-msg';
  sys2.style.marginBottom = '16px';
  sys2.textContent = '——雨衣——';
  c.appendChild(sys2);

  await sleep(600);

  const p1 = document.createElement('div');
  p1.className = 'narration';
  c.appendChild(p1);
  await typeText(p1, '冬日。你提著一只皮箱，為了出席某位友人的結婚披露宴，從避暑地叫了一輛汽車趕往東海道的某個停車場。');

  const p2 = document.createElement('div');
  p2.className = 'narration';
  c.appendChild(p2);
  await typeText(p2, '車上除了你以外，還坐著一位理髮店的老闆。他是個棗子般圓滾滾的男人。你一邊在意著時間，一邊偶爾跟他聊上幾句。');

  await sleep(300);

  const sp = document.createElement('div');
  sp.className = 'speaker';
  sp.textContent = '── 理髮店主人';
  c.appendChild(sp);
  const d1 = document.createElement('div');
  d1.className = 'dialogue';
  c.appendChild(d1);
  await typeText(d1, '「妙なこともありますね。××さんの屋敷には昼間でも幽霊が出るって云うんですが。」\n「也有奇怪的事呢。聽說 ×× 先生的宅邸，白天也有幽靈出沒。」');

  await sleep(200);

  addToHistory('第一章　レエン・コオト', 'system-msg', 'system');
  addToHistory('——雨衣——', 'system-msg', 'system');
  addToHistory('冬日。你提著一只皮箱，為了出席某位友人的結婚披露宴，從避暑地叫了一輛汽車趕往東海道的某個停車場。');
  addToHistory('車上除了你以外，還坐著一位理髮店的老闆。他是個棗子般圓滾滾的男人。你一邊在意著時間，一邊偶爾跟他聊上幾句。');
  addToHistory('「也有奇怪的事呢。聽說 ×× 先生的宅邸，白天也有幽靈出沒。」', 'dialogue');

  c.innerHTML += `
    <div class="choices">
      <div class="choices-label">── 行動選擇 ──</div>
      <button class="choice-btn" onclick="choiceJoke()">「下雨天出來——是來淋雨的吧？」</button>
      <button class="choice-btn" onclick="choiceSilent()">沉默地望向窗外的松林。</button>
    </div>
  `;
}

async function choiceJoke() {
  state.choicesMade.joke = true;
  state.writing += 1;
  addToHistory('「下雨天出來——是來淋雨的吧？」', 'choice-made', 'choice');
  updateStatus();
  await renderBarber2();
}

async function choiceSilent() {
  state.choicesMade.silent = true;
  addToHistory('沉默地望向窗外的松林。', 'choice-made', 'choice');
  await renderBarber2();
}

async function renderBarber2() {
  const c = $('#content');
  c.innerHTML = renderHistory();

  if (state.choicesMade.joke) {
    if (state.writing > 0) showImpact('<span class="impact-label">執筆</span>　+1', 'gain');
    const sp = document.createElement('div'); sp.className = 'speaker'; sp.textContent = '── 理髮店主人'; c.appendChild(sp);
    const d = document.createElement('div'); d.className = 'dialogue'; c.appendChild(d);
    await typeText(d, '「御常談で。……しかしレエン・コオトを着た��霊だって云うんです。」\n「您說笑了。……不過聽說是穿著雨衣的幽靈呢。」');
    addToHistory('「您說笑了。……不過聽說是穿著雨衣的幽靈呢。」', 'dialogue');
  } else {
    const n = document.createElement('div'); n.className = 'narration'; c.appendChild(n);
    await typeText(n, '理髮店主人見你沉默，又自顧自地說了下去——穿著雨衣的幽靈。');
    addToHistory('理髮店主人見你沉默，又自顧自地說了下去——穿著雨衣的幽靈。');
  }

  const p = document.createElement('div'); p.className = 'narration'; c.appendChild(p);
  await typeText(p, '汽車鳴著喇叭，橫靠在了某個停車場旁。果然——上行列車在兩三分鐘前剛剛開走了。');
  addToHistory('汽車鳴著喇叭，橫靠在了某個停車場旁。果然——上行列車在兩三分鐘前剛剛開走了。');

  await sleep(300);
  const p2 = document.createElement('div'); p2.className = 'narration'; c.appendChild(p2);

async function renderForcedSequence() {
  const c = $('#content');

  const steps = getPhoneSteps();
  const stepsDiv = document.createElement('div');
  stepsDiv.id = 'forced-steps';
  stepsDiv.style.margin = '12px 0';
  c.appendChild(stepsDiv);

  for (let i = 0; i < steps.length; i++) {
    await showForcedStep(stepsDiv, steps, i);
  }

  // After all steps complete
  await sleep(400);
  await renderPhoneCall();
}

function getPhoneSteps() {
  const n = state.nerve;
  if (n >= 8) return ['接起電話。'];
  if (n >= 5) return ['站起來。', '走到電話旁。', '拿起聽筒。'];
  if (n >= 3) return ['站起來。', '左腳。', '右腳。', '伸手。', '握住聽筒。', '貼到耳邊。'];
  return [
    '你必須：從椅子上站起來。',
    '你必須：感覺你的腿。',
    '你必須：往電話的方向走。',
    '你必須：伸出手。',
    '你必須：握住聽筒。',
    '你必須：把它舉到耳邊。',
    '你必須：說話。',
  ];
}

function showForcedStep(container, steps, index) {
  return new Promise(resolve => {
    const div = document.createElement('div');
    div.style.marginBottom = '4px';
    div.innerHTML = renderForcedBtn(steps[index], `completeStep(this, ${index})`);
    container.appendChild(div);

    // Store resolve so button click can trigger it
    div.querySelector('.forced-btn')._resolve = resolve;
    div.querySelector('.forced-btn')._index = index;
  });
}

function completeStep(btn, index) {
  const text = btn.textContent;
  const wrapper = btn.closest('.forced-wrapper');
  const container = wrapper.parentElement;

  // Replace button with completed text
  container.innerHTML = `<div style="color:#5a4a38; font-size:13px; font-style:italic; margin-bottom:4px;">✓ ${text}</div>`;

  // Resolve the promise
  if (btn._resolve) btn._resolve();
}
